[package]
name = "opencodex-desktop"
version = "2.61.0"
description = "OpenCodex desktop shell"
authors = ["OpenCodex contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "opencodex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
uuid = { version = "=1.18.1", features = ["v4"] }
tauri = { version = "=2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.5.0"
tauri-plugin-opener = "=2.5.3"
tauri-plugin-process = "=2.3.0"
tauri-plugin-shell = "=2.2.0"
tauri-plugin-single-instance = "=2.4.0"
tauri-plugin-updater = "=2.9.0"
tokio = { version = "=1.45.1", features = ["sync", "time"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
