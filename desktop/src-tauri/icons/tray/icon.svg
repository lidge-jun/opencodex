<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="-29.096 -77.866 1028.052 1028.052" role="img" aria-label="opencodex">
  <!--
    The menu bar variant of icon.svg: the same curves, the same prompt cut, no backdrop.

    macOS treats a status item image as a template — it reads the alpha channel as coverage and
    paints it with the current menu bar tint, so the artwork has to be black and transparent and
    the prompt has to be an actual hole. The orbit arcs and dots are dropped: at 22pt they resolve
    into a ring of grey specks rather than a dashed circle. The viewBox is the ink bounds of the
    cloud and the braces, plus 6%, so the glyph fills the menu bar height instead of the margin.

    tests/ci-workflows/build-desktop-icon-set.test.ts requires every path here to appear verbatim
    in icon.svg, so the two files cannot drift.
  -->
