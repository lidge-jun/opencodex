<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="45.62 34.12 419.76 419.76" role="img" aria-label="opencodex">
  <!--
    The menu bar variant of icon.svg: same traced curves, same prompt cut, no backdrop.

    macOS treats a status item image as a template — it reads the alpha channel as coverage and
    paints it with the current menu bar tint, so the artwork has to be black and transparent and
    the prompt has to be an actual hole. The orbit arcs and dots are dropped: at 22pt they resolve
    into a ring of grey specks rather than a dashed circle. The viewBox is the ink bounds of what
    is left, plus 6%, so the glyph fills the menu bar height instead of the source margin.

    tests/ci-workflows/build-desktop-icon-set.test.ts requires every path here to appear verbatim
    in icon.svg, so the two files cannot drift.
  -->
  <defs>
    <mask id="prompt" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="0" y="0" width="512" height="512" fill="#ffffff"/>
      <g fill="#000000" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
        <path d="M193.4 206.5 214.6 244 193.4 281.5" fill="none" stroke-width="22"/>
        <rect x="253.5" y="271" width="71" height="22.5" rx="11.25"/>
      </g>
    </mask>
  </defs>
