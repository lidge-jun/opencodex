<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="opencodex">
  <!--
    The opencodex mark, as a vector. Every committed raster in this directory is this file rendered
    at one size by desktop/scripts/generate-icons.ts, so the sizes cannot drift apart.

    Where the geometry comes from. The cloud, the two braces, the four orbit arcs and the two dots
    are traced from the alpha channel of assets/logo-light.png, upsampled 4x and thresholded at
    alpha 110 — the outline is measured from the brand artwork, not redrawn by eye.

    Why the prompt is drawn instead of traced. In that artwork the chevron and the underscore are
    engraved: alpha 217+ against a 206 body, with a lit rim on one edge. That reads as depth at
    512px and as nothing at all below 128px, which is where an app icon actually lives. They are
    redrawn here as flat geometry on the measured centreline and cut out of the mark, so the
    backdrop shows through them. The cut is what also gives the menu bar template real holes
    instead of a black blob — see tray/icon.svg.

    Why the backdrop is a full-bleed opaque square. Apple's current app icon guidance asks for a
    square, unmasked, full-bleed source: macOS applies its own rounded-rectangle mask and material,
    and a pre-masked corner fights that and shows as jagged edges. The transparent-cornered mark
    this file replaces is what made Finder fall back to a default grey tile.
  -->
  <defs>
    <mask id="prompt" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="0" y="0" width="512" height="512" fill="#ffffff"/>
      <g fill="#000000" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
        <path d="M193.4 206.5 214.6 244 193.4 281.5" fill="none" stroke-width="22"/>
        <rect x="253.5" y="271" width="71" height="22.5" rx="11.25"/>
      </g>
    </mask>
  </defs>
  <rect id="backdrop" x="0" y="0" width="1024" height="1024" fill="#fcfcfc"/>
  <g id="mark" fill="#2c2c2c" mask="url(#prompt)" transform="translate(2 26) scale(2)">
