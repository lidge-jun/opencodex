<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- the vector mark recolours itself for dark browser chrome; the PNG is the generated fallback -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>opencodex · proxy dashboard</title>
    <script>
      // FOWT guard: apply an explicit light/dark choice before first paint. "system" leaves the
      // attribute unset so color-scheme:light-dark follows the OS. Mirrors App.tsx.
      (function () {
        try {
          var t = localStorage.getItem("ocx-theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
        // FOUT guard: set <html lang> before first paint so :lang() font stacks apply immediately.
        // Mirrors detectInitial() + LOCALES in src/i18n/shared.ts.
        var langMap = { en: "en", de: "de", fr: "fr", ko: "ko", zh: "zh-CN", "zh-TW": "zh-TW", ru: "ru", ja: "ja", tr: "tr", vi: "vi" };
        langMap.pt = "pt-BR";
        var stored = null;
        try {
          stored = localStorage.getItem("ocx-lang");
        } catch (e) {
          stored = null; // storage blocked: fall back to navigator.language below
        }
        var locale = stored && Object.prototype.hasOwnProperty.call(langMap, stored) ? stored : null;
        if (!locale) {
          var nav = (navigator.language || "en").toLowerCase();
          if (nav.indexOf("zh") === 0) {
            locale = /tw|hk|mo|hant/.test(nav) ? "zh-TW" : "zh";
          } else {
            locale = ["de", "fr", "ko", "ru", "ja", "tr", "vi", "pt"].filter(function (c) { return nav.indexOf(c) === 0; })[0] || "en";
          }
        }
        document.documentElement.lang = langMap[locale];
        // Someone who switched to the classic dashboard keeps landing there (src/lib/dashboard-edition.ts).
        // The tray popover is not a dashboard page and stays on this build.
        var edition = null;
        try {
          edition = localStorage.getItem("ocx-ui");
        } catch (e) {
          edition = null; // storage blocked: stay on this dashboard
        }
        if (edition === "classic" && location.hash.indexOf("#/tray") !== 0) {
          location.replace("/classic/" + location.search + location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
