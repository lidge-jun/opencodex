name: Setup project Bun
description: >-
  Install the package.json Bun pin for a job's role: dependencies.bun for
  runtime (default), or testRunnerBun for test-runner.

# Runtime 1.4.2 fixes #6684's Windows Bun.fetch stream truncation. The test runner
# skipped 1.4.2: #4821 reverted #4064 after its multi-file --isolate preload segfault
# (#6713 run 37631558263: Linux 1/4, macOS 2/2, Windows 9/9). It moved from 1.4.0 to
# 1.4.3 for oven-sh/bun#44581: 1.4.0's Bun.spawnSync could lose a child's exit after
# finalizers ran inside an earlier call and spin past its own timeout (#4956).
# Both roles now default to the package's 1.4.4 security transition, retaining role validation.
# Promotion requires a green full cross-platform lane=all run on the exact candidate head.
inputs:
  role:
    description: Bun role to install (runtime or test-runner).
    required: false
    default: runtime

outputs:
  version:
    description: The resolved Bun version string.
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve project Bun version
      id: resolve
      shell: bash
      env:
        BUN_ROLE: ${{ inputs.role }}
      run: |
        node <<'NODE'
        const pkg = require('./package.json');
        const role = process.env.BUN_ROLE;
        let key;
        let version;
        switch (role) {
          case 'runtime': key = 'dependencies.bun'; version = pkg.dependencies?.bun; break;
          case 'test-runner': key = 'testRunnerBun'; version = pkg.testRunnerBun; break;
          default:
            console.error(`::error::Unknown Bun role: ${role}`);
            process.exit(1);
        }
        if (typeof version !== 'string' || version !== version.trim() || !/^\d+\.\d+\.\d+$/.test(version)) {
          console.error(`::error::Missing or invalid package.json ${key} for Bun role ${role}`);
          process.exit(1);
        }
        require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
        console.log(`Using Bun ${version} from package.json ${key} (${role})`);
        NODE

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ steps.resolve.outputs.version }}
