name: CL-10 contract amendments

on:
  push:
    branches:
      - feat/cl-10-public-evidence-contract

concurrency:
  group: cl10-contract-amend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  amend:
    name: amend CL-10 contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Temporary self-removing job needs to publish the reviewed documentation patch.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Apply review amendments
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          contract_path = Path('devlog/_plan/260807_compatibility_lab/010_cl10_public_evidence_export.md')
          design_path = Path('docs/superpowers/specs/2026-08-12-cl10-public-evidence-design.md')
          contract = contract_path.read_text()
          design = design_path.read_text()

          contract = contract.replace(
              'This PR is contract-only. It freezes the public-export and community-trust boundary before any runtime export, upload, remote fetch, or community-evidence ingestion is authorized.',
              'This PR began contract-only and the contract was independently reviewed and accepted on 2026-08-12. CL-10.1 through CL-10.4 runtime implementation is now authorized on this branch. CL-10.5 remote publishing remains blocked until the exact transport/service contract in section 18 is independently accepted.'
          )

          contract = contract.replace(
              'V1 exportable routes are limited to public registry routes whose exported behavior identity is entirely composed from reviewed public fields.',
              '''V1 exportable routes are limited to entries in the repo-reviewed `PublicRouteRegistryManifestV1` whose exported behavior identity is entirely composed from reviewed public fields.\n\nThe public-route authority is a versioned, content-addressed repository artifact owned by OpenCodex, not a publisher-supplied assertion:\n\n```ts\ninterface PublicRouteRegistryManifestV1 {\n  schemaVersion: "public_route_registry_v1";\n  registryVersion: string;\n  sourceCommit: string;\n  entries: PublicRouteRegistryEntryV1[];\n  manifestDigest: string;\n}\n\ninterface PublicRouteRegistryEntryV1 {\n  providerId: string;\n  modelId: string;\n  adapterFamilies: Array<"openai-responses" | "openai-chat" | "anthropic-messages">;\n}\n```\n\nCL-10.1 must ship and validate this manifest before any route-scoped record is exportable. The manifest may be updated only by reviewed repository changes with a new digest/version. Dynamic model discovery, cached catalogs, user configuration, imported bundles, and a matching spelling alone can never extend this authority.'''
          )

          old_schema = '''interface PublicEvidenceRecordV1 {\n  recordId: string;\n  subjectId: string;\n  evidenceLayer: "protocol_conformance" | "live_route_compatibility" | "task_effectiveness";\n  suiteId: string;\n  suiteVersion: string;\n  scenarioId: string;\n  scenarioVersion: string;\n  verdict: "CLAIMED" | "PROBED" | "VERIFIED" | "DEGRADED" | "UNSUPPORTED" | "BLOCKED" | "UNKNOWN";\n  observedDayUtc: string;\n  publicRoute: PublicRouteDescriptorV1;\n  assertions: PublicAssertionSummaryV1[];\n  incidentRefs?: string[];\n  artifactRefs?: string[];\n}\n```'''
          new_schema = '''interface PublicEvidenceRecordV1 {\n  recordId: string;\n  subjectId: string;\n  evidenceLayer: "protocol_conformance" | "live_route_compatibility" | "task_effectiveness";\n  suiteId: string;\n  suiteVersion: string;\n  scenarioId: string;\n  scenarioVersion: string;\n  verdict: "CLAIMED" | "PROBED" | "VERIFIED" | "DEGRADED" | "UNSUPPORTED" | "BLOCKED" | "UNKNOWN";\n  observedDayUtc: string;\n  subject: PublicEvidenceSubjectV1;\n  assertions: PublicAssertionSummaryV1[];\n  incidentRefs?: PublicIncidentRefV1[];\n  artifactRefs?: string[];\n}\n\ntype PublicEvidenceSubjectV1 =\n  | PublicProtocolSubjectV1\n  | PublicRouteSubjectV1\n  | PublicTaskSubjectV1;\n\ninterface PublicIncidentRefV1 {\n  corpusId: string; // exact reviewed `IC-NNN` identifier only\n}\n```'''
          if old_schema not in contract:
              raise SystemExit('public record schema anchor changed')
          contract = contract.replace(old_schema, new_schema)

          contract = contract.replace(
              'The exact implementation types may use existing repository enum/type names where they already provide stricter closed sets, but the public schema must remain closed and independently versioned from local ledger schemas.\n\nUnknown top-level or nested fields fail export and import validation.',
              '''The public runtime types are dedicated CL-10 types. They may import closed scalar unions such as the existing verdict/evidence-layer literals, but they must not alias, extend, spread, or serialize local ledger/query DTO interfaces. A compile-time TypeScript shape is not the security boundary: every export/import path must pass the dedicated runtime validator for the matching public schema version.\n\n`PublicEvidenceSubjectV1` is layer-matched: protocol records use only a public protocol descriptor, live-route records use only a public route descriptor backed by `PublicRouteRegistryManifestV1`, and task records use a public task descriptor that nests the same public route descriptor plus reviewed public task/verifier authority fields. A layer/subject-kind mismatch is `schema_rejected`.\n\nUnknown top-level or nested fields fail export and import validation.\n\n`incidentRefs` contain only exact reviewed corpus identifiers matching `^IC-[0-9]{3}$` that exist in the repository incident authority. They never contain the corpus entry's historical issue URLs, devlog paths, test paths, prose, or source metadata. `artifactRefs` contain only public artifact IDs present in the same bundle; local artifact digests/relative paths are forbidden.'''
          )

          contract = contract.replace(
              'Deleting local Lab data remains absolute locally. Public copies already distributed cannot be cryptographically erased, so revocation semantics are required separately.',
              '''Deleting local Lab data remains absolute locally. Public copies already distributed cannot be cryptographically erased, so revocation semantics are required separately.\n\n### Sensitive purge interaction\n\nCL-00 sensitive purge remains authoritative over CL-10 local copies. A purge whose closed action set includes `export` must fail closed until every affected local export/staging copy is removed. CL-10 must additionally remove any locally-originated copy of an affected bundle that has been imported into the local `community/` cache. Third-party community bundles are unrelated to the local sensitive bytes and are not deleted merely because they contain the same public route identity.\n\nA local sensitive purge never waits for network access. If an affected bundle was previously published, CL-10 records or emits a bounded signed `privacy_retraction` revocation for its public bundle/record IDs when the reviewed transport is available, but remote acknowledgement is not a prerequisite for completing the mandatory local purge. The purge must not retain sensitive bytes merely to construct a later revocation.'''
          )

          contract = contract.replace(
              'CL-10 defines `PublicEvidenceRevocationV1` as a signed public statement from the same publisher key that references one or more bundle/record IDs and a finite reason code.',
              '''CL-10 defines `PublicEvidenceRevocationV1` as a signed, bounded public statement from the same publisher key that signed the target bundle and references one or more bundle/record IDs plus a finite reason code.\n\nA consumer bootstraps revocation authority from the already-verified target bundle: `publisher.keyId` and the exact Ed25519 public key in the revocation must match that target bundle before the revocation signature is considered. V1 does not support cross-key revocation or key rotation. A key-rotation protocol requires a later reviewed schema version.\n\nA revocation contains its own domain-separated digest/ID, `issuedDayUtc`, at most 256 sorted unique target IDs, and no free-form reason text. Re-importing the exact same revocation ID and bytes is idempotent. The same revocation ID with different canonical bytes, duplicate target IDs, an unknown target, unsupported reason/version, or a publisher-key mismatch is rejected. Consumers may retain bounded revocations received before a referenced record only in a quarantined pending set with the same structural limits; they do not become effective until the matching publisher/target bundle is present and verified.'''
          )

          contract = contract.replace(
              'CL-10 implementation should extend existing Lab surfaces rather than create an unrelated product area.',
              'CL-10 implementation should extend existing Lab surfaces rather than create an unrelated product area. CL-10.1 through CL-10.4 are authorized after the accepted contract review; this does not relax the remote-publishing gate.'
          )

          contract = contract.replace(
              'This PR only:\n\n- record CL-09 closure;',
              'Contract work completed on this PR before runtime implementation:\n\n- record CL-09 closure;'
          )
          contract = contract.replace(
              'No runtime export, import, upload, remote fetch, signing-key creation, community cache, API, CLI, or UI implementation is authorized by CL-10.0 alone.',
              'Independent review accepted CL-10.0 on 2026-08-12. CL-10.1 through CL-10.4 are therefore authorized on this branch by explicit maintainer direction. CL-10.5 remains blocked by section 18.'
          )
          contract = contract.replace(
              'Do not implement CL-10 runtime code from this contract PR until the contract is independently accepted.\n\nAcceptance of CL-10.0 authorizes the CL-10 implementation sequence. It does not authorize a remote publishing service until section 18 has been completed with an exact reviewed transport contract.',
              'The CL-10 contract was independently accepted on 2026-08-12 and explicit maintainer direction authorizes CL-10.1 through CL-10.4 runtime implementation on this branch.\n\nNo CL-10.5 remote publishing code, upload transport, remote fetch, or arbitrary network publication is authorized until section 18 has been completed with an exact reviewed transport contract and independently accepted.'
          )

          design = design.replace(
              'Design approved for contract drafting on 2026-08-12. Runtime implementation remains blocked on independent acceptance of the CL-10 contract.',
              'Design approved for contract drafting on 2026-08-12. Independent review accepted the contract on 2026-08-12, and explicit maintainer direction now authorizes CL-10.1 through CL-10.4 runtime implementation on this branch. CL-10.5 remote publishing remains blocked on an exact independently accepted transport/service contract.'
          )
          design = design.replace(
              'A local route is exportable only when its behavior can be represented entirely through reviewed public registry fields.',
              'A local route is exportable only when its behavior can be represented entirely through entries in the versioned, content-addressed, repo-reviewed `PublicRouteRegistryManifestV1`; dynamic discovery, config, and imported bundles cannot extend that authority.'
          )
          design = design.replace(
              '`PublicEvidenceBundleV1` is independently versioned and allowlist-only. It contains only public suite/scenario versions, evidence layer, verdict, UTC-day observation bucket, reviewed public route identity, closed assertion summaries, allowed incident references, and explicitly public artifacts.',
              '`PublicEvidenceBundleV1` is independently versioned and allowlist-only. Dedicated runtime validators enforce its closed types. Records use a layer-matched public subject union rather than assuming every evidence layer is a route. Incident references are closed `IC-NNN` corpus IDs only, and artifact references resolve only to public artifacts in the same bundle.'
          )
          design = design.replace(
              'Publishers can issue signed revocations with finite reason codes.',
              'Publishers can issue signed revocations with finite reason codes. Revocation authority bootstraps from the exact publisher key embedded in the already-verified target bundle; V1 permits no cross-key revocation or key rotation, and duplicate identical revocations are idempotent while conflicting replay fails closed.'
          )
          design = design.replace(
              'Remote deletion is transport-specific and does not replace revocation.',
              'Remote deletion is transport-specific and does not replace revocation. CL-00 sensitive purge still removes every affected local generated export plus locally-originated community-cache copy fail-closed; local purge never depends on network acknowledgement.'
          )
          design = design.replace(
              'Contract PR validation is documentation/hygiene plus independent review only. No runtime CL-10 code belongs in the contract PR.',
              'The contract review gate is satisfied. Runtime CL-10.1 through CL-10.4 may now land on this PR under TDD and full validation; CL-10.5 remote publishing remains out of scope.'
          )

          contract_path.write_text(contract)
          design_path.write_text(design)
          PY

          rm .github/workflows/cl10-contract-amend.yml
          git diff --check
          if git diff --quiet -- devlog/_plan/260807_compatibility_lab/010_cl10_public_evidence_export.md docs/superpowers/specs/2026-08-12-cl10-public-evidence-design.md; then
            echo 'expected contract changes were not produced' >&2
            exit 1
          fi

      - name: Commit amendments and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wibias'
          git config user.email '37517432+Wibias@users.noreply.github.com'
          git add devlog/_plan/260807_compatibility_lab/010_cl10_public_evidence_export.md docs/superpowers/specs/2026-08-12-cl10-public-evidence-design.md .github/workflows/cl10-contract-amend.yml
          git commit -m 'docs(lab): address CL-10 contract review'
          git push origin HEAD:feat/cl-10-public-evidence-contract
