name: CL09 surfaces patch

on:
  push:
    branches:
      - feat/cl-09-passive-production-evidence
    paths:
      - .github/workflows/cl09-surfaces-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cl-09-passive-production-evidence
      - name: Apply CL-09 read surfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'anchor missing in {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          # Management API
          path = 'src/server/management/lab-routes.ts'
          replace_once(path,
              '  queryLabVerdicts,\n} from "../../lab/query";',
              '  queryLabVerdicts,\n  queryPassiveProductionSignals,\n} from "../../lab/query";')
          replace_once(path,
              '''  if (url.pathname === "/api/lab/status") {\n    return jsonResponse(queryLabStatus(), 200, req, config);\n  }\n\n''',
              '''  if (url.pathname === "/api/lab/status") {\n    return jsonResponse(queryLabStatus(), 200, req, config);\n  }\n\n  if (url.pathname === "/api/lab/production-signals") {\n    const subjectId = url.searchParams.get("subjectId")?.trim();\n    if (!subjectId) return errorResponse("invalid_subject", "subjectId is required", 400, ctx);\n    const limit = parseLimit(url.searchParams.get("limit"), ctx);\n    if (limit instanceof Response) return limit;\n    try {\n      return jsonResponse(queryPassiveProductionSignals(subjectId, limit), 200, req, config);\n    } catch {\n      return errorResponse("invalid_subject", "subjectId must be an exact Lab route subject id", 400, ctx);\n    }\n  }\n\n''')

          # CLI
          path = 'src/cli/lab.ts'
          replace_once(path,
              '  queryLabVerdicts,\n} from "../lab/query";',
              '  queryLabVerdicts,\n  queryPassiveProductionSignals,\n  type PassiveProductionQueryResultV1,\n} from "../lab/query";')
          replace_once(path,
              '  ocx lab status [--json]\n',
              '  ocx lab status [--json]\n  ocx lab production-signals --subject <id> [--limit <n>] [--json]\n')
          replace_once(path,
              '''function automationStatusLines(status: ReturnType<typeof buildLabAutomationStatus>): string[] {\n''',
              '''function passiveProductionLines(result: PassiveProductionQueryResultV1): string[] {\n  const summary = result.summary;\n  return [\n    "Observed production traffic (not Lab verification)",\n    `Attempts: ${summary.recentProductionAttempts} | Successes: ${summary.recentSuccessfulAttempts} | Route errors: ${summary.recentRouteErrorSignals}`,\n    ...(summary.lastObservedProductionAttempt !== undefined\n      ? [`Last observed: ${summary.lastObservedProductionAttempt}`]\n      : []),\n  ];\n}\n\nfunction automationStatusLines(status: ReturnType<typeof buildLabAutomationStatus>): string[] {\n''')
          replace_once(path,
              '''        case "verdicts": {\n''',
              '''        case "production-signals": {\n          const subjectId = takeOption(rest, "--subject");\n          const limit = takeIntegerOption(rest, "--limit", { min: 1 });\n          rejectArgs(rest, USAGE);\n          if (!subjectId) throw new CliUsageError("--subject is required", USAGE);\n          const result = queryPassiveProductionSignals(subjectId, limit);\n          printData(result, wantsJson, passiveProductionLines(result));\n          return;\n        }\n        case "verdicts": {\n''')

          # Compatibility Matrix data client. Keep passive data distinct from verdict DTOs.
          path = 'gui/src/pages/compatibility-matrix-api.ts'
          replace_once(path,
              '''export type LabPageData = {\n''',
              '''export type PassiveProductionSummaryDto = {\n  verificationStatus: "not_verification";\n  summary: {\n    subjectId: string;\n    verificationStatus: "not_verification";\n    recentProductionAttempts: number;\n    recentSuccessfulAttempts: number;\n    recentRouteErrorSignals: number;\n    lastObservedProductionAttempt?: number;\n  };\n};\n\nfunction parsePassiveProductionSummary(raw: unknown): PassiveProductionSummaryDto {\n  if (!isPlainObject(raw) || raw.verificationStatus !== "not_verification" || !isPlainObject(raw.summary)) {\n    throw invalidResponse();\n  }\n  const summary = raw.summary;\n  if (summary.verificationStatus !== "not_verification"\n    || typeof summary.subjectId !== "string"\n    || typeof summary.recentProductionAttempts !== "number"\n    || typeof summary.recentSuccessfulAttempts !== "number"\n    || typeof summary.recentRouteErrorSignals !== "number"\n    || (summary.lastObservedProductionAttempt !== undefined && typeof summary.lastObservedProductionAttempt !== "number")) {\n    throw invalidResponse();\n  }\n  return { verificationStatus: "not_verification", summary: summary as PassiveProductionSummaryDto["summary"] };\n}\n\nexport async function fetchPassiveProductionSummary(\n  apiBase: string,\n  subjectId: string,\n  signal: AbortSignal,\n): Promise<PassiveProductionSummaryDto> {\n  const raw = await fetchLabJson<unknown>(\n    apiBase,\n    `/api/lab/production-signals?subjectId=${encodeURIComponent(subjectId)}&limit=50`,\n    signal,\n  );\n  return parsePassiveProductionSummary(raw);\n}\n\nexport type LabPageData = {\n''')
          replace_once(path,
              '''export type VerdictDetailData = {\n  subject: SubjectDetailDto;\n  observations: ObservationDto[];\n  observationsTruncated: boolean;\n  events: LabEventDto[];\n  artifacts: ArtifactMetadataDto[];\n};\n''',
              '''export type VerdictDetailData = {\n  subject: SubjectDetailDto;\n  observations: ObservationDto[];\n  observationsTruncated: boolean;\n  events: LabEventDto[];\n  artifacts: ArtifactMetadataDto[];\n  production: PassiveProductionSummaryDto | null;\n};\n''')
          replace_once(path,
              '''  const [subject, observations, events, artifacts] = await Promise.all([\n    fetchSubjectDetail(apiBase, verdict.subjectId, signal),\n    fetchAllObservations(apiBase, observationFilters, signal),\n    mapSettledBounded(eventIds, DETAIL_CONCURRENCY, signal, id => fetchEventById(apiBase, id, signal)),\n    mapSettledBounded(digests, DETAIL_CONCURRENCY, signal, digest => fetchArtifactByDigest(apiBase, digest, signal)),\n  ]);\n''',
              '''  const [subject, observations, events, artifacts, production] = await Promise.all([\n    fetchSubjectDetail(apiBase, verdict.subjectId, signal),\n    fetchAllObservations(apiBase, observationFilters, signal),\n    mapSettledBounded(eventIds, DETAIL_CONCURRENCY, signal, id => fetchEventById(apiBase, id, signal)),\n    mapSettledBounded(digests, DETAIL_CONCURRENCY, signal, digest => fetchArtifactByDigest(apiBase, digest, signal)),\n    fetchPassiveProductionSummary(apiBase, verdict.subjectId, signal).catch(error => {\n      if (signal.aborted) throw error;\n      return null;\n    }),\n  ]);\n''')
          replace_once(path,
              '''    events,\n    artifacts,\n  };\n}\n''',
              '''    events,\n    artifacts,\n    production,\n  };\n}\n''')

          # Existing detail pane only; no new product area and no combined score/status.
          path = 'gui/src/pages/CompatibilityMatrix.tsx'
          replace_once(path,
              '''          {detail.observations.length > 0 && (\n''',
              '''          {detail.production && (\n            <section className="lab-detail-section" data-testid="lab-production-signals">\n              <h4>Observed production traffic</h4>\n              <p className="muted">Not Lab verification</p>\n              <dl className="lab-detail-meta">\n                <div><dt>Attempts</dt><dd>{detail.production.summary.recentProductionAttempts}</dd></div>\n                <div><dt>Successes</dt><dd>{detail.production.summary.recentSuccessfulAttempts}</dd></div>\n                <div><dt>Route errors</dt><dd>{detail.production.summary.recentRouteErrorSignals}</dd></div>\n                {detail.production.summary.lastObservedProductionAttempt !== undefined && (\n                  <div><dt>Last observed</dt><dd>{formatAsOf(detail.production.summary.lastObservedProductionAttempt, locale)}</dd></div>\n                )}\n              </dl>\n            </section>\n          )}\n          {detail.observations.length > 0 && (\n''')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/cl09-surfaces-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/server/management/lab-routes.ts src/cli/lab.ts gui/src/pages/compatibility-matrix-api.ts gui/src/pages/CompatibilityMatrix.tsx
          git commit -m "feat(lab): expose passive production signals"
          git push origin HEAD:feat/cl-09-passive-production-evidence
