name: Track 4 documentation build validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t4-docs-validation-81a8
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 6eec1265c756e406baa28688661d59e258aa7319
          persist-credentials: false
      - name: Record source identity
        run: git rev-parse HEAD
      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun
      - name: Install frozen documentation dependencies
        working-directory: docs-site
        run: bun install --frozen-lockfile
      - name: Build documentation without deployment
        working-directory: docs-site
        run: bun run build
