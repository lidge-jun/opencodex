name: Temporary dev2-go source export

on:
  push:
    branches:
      - dev2-go

permissions:
  contents: read

jobs:
  export-go-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Upload Go source tree
        uses: actions/upload-artifact@v4
        with:
          name: dev2-go-source
          path: go/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
