name: Catalog async contracts

on:
  push:
    branches: [dev, main, preview]
    paths:
      - src/**
      - scripts/diagnostics/windows-version-control/**
      - .github/actions/setup-project-bun/**
      - .github/workflows/catalog-async-contracts.yml
      - package.json
      - bun.lock
  pull_request:
    paths:
      - src/**
      - scripts/diagnostics/windows-version-control/**
      - .github/actions/setup-project-bun/**
      - .github/workflows/catalog-async-contracts.yml
      - package.json
      - bun.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-async-contracts-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Catalog async contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project-bun
        with:
          role: runtime
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot; the action publishes no release tags, so the toolchain is pinned explicitly
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Install repository dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: cargo fmt --manifest-path scripts/diagnostics/windows-version-control/Cargo.toml --check
      - name: Check Rust contracts
        run: cargo clippy --locked --manifest-path scripts/diagnostics/windows-version-control/Cargo.toml --all-targets -- -D warnings
      - name: Run Bun-module contracts through the portable Rust fixture
        run: cargo test --locked --manifest-path scripts/diagnostics/windows-version-control/Cargo.toml --test async_contracts -- --test-threads=4
