name: Anthropic instance contract diagnostic
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  react-doctor-report:
    if: github.event.pull_request.head.ref == 'codex/anthropic2-account-pool'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Print React Doctor findings for changed GUI files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          git diff --name-only "$BASE_SHA"...HEAD -- gui > "$RUNNER_TEMP/changed-root.txt"
          sed 's#^gui/##' "$RUNNER_TEMP/changed-root.txt" > "$RUNNER_TEMP/changed-gui.txt"
          for list in changed-root.txt changed-gui.txt; do
            echo "== $list"
            npm exec --yes --package react-doctor@0.9.11 -- react-doctor gui --json --blocking warning --scope changed --changed-files-from "$RUNNER_TEMP/$list" > "$RUNNER_TEMP/report.json"
            echo "exit=$?"
            node -e 'const r=require(process.argv[1]);const d=r.diagnostics||r.issues||r.findings||r;console.log(JSON.stringify(d,null,1).slice(0,20000))' "$RUNNER_TEMP/report.json" || cat "$RUNNER_TEMP/report.json" | head -c 20000
          done
  old-version:
    if: github.event.pull_request.head.ref == 'codex/anthropic2-account-pool'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup-project-bun
        with:
          role: runtime
      - name: Checkout pinned pre-feature source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: 6a7632db2a85c359da9feac976180450ebb42c60
          path: .tmp/anthropic-old
      - run: bun install --frozen-lockfile
        working-directory: .tmp/anthropic-old
      - name: Observe old-version auth and config preservation
        run: bun tests/fixtures/anthropic-instance-old-version.ts .tmp/anthropic-old .tmp/state11/receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anthropic2-old-version-${{ github.event.pull_request.head.sha }}
          path: .tmp/state11/receipt.json
          if-no-files-found: error
  contracts:
    if: github.event.pull_request.head.ref == 'codex/anthropic2-account-pool'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup-project-bun
        with:
          role: test-runner
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: gui
      - name: Isolated instance contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            tests/adapters/anthropic/anthropic-instance-isolation.test.ts \
            tests/adapters/anthropic/anthropic-instance-pool-parity.test.ts \
            tests/adapters/anthropic/anthropic-instance-quota.test.ts \
            tests/adapters/anthropic/anthropic-instance-recovery.test.ts \
            tests/adapters/anthropic/anthropic2-fast-parity.test.ts \
            tests/claude-integration/anthropic2-native-routing.test.ts \
            tests/oauth/oauth-anthropic-instance-health.test.ts \
            tests/responses/anthropic2-responses-parity.test.ts \
            tests/claude-integration/messages-native-oauth.test.ts \
            tests/adapters/anthropic/anthropic-account-pool.test.ts \
            tests/adapters/anthropic/anthropic-429-policy.test.ts \
            tests/adapters/anthropic/anthropic-model-weekly-admission.test.ts \
            tests/oauth/oauth-anthropic-instance-multiprocess.test.ts \
            tests/oauth/oauth-anthropic-instance-refresh.test.ts \
            tests/oauth/oauth-anthropic-instance-registration.test.ts \
            tests/oauth/anthropic2-discovery-ownership.test.ts \
            tests/config/config-anthropic-instance-pool.test.ts \
            tests/providers/provider-anthropic-instance.test.ts \
            tests/oauth/oauth-refresh.test.ts \
            tests/oauth/oauth-store-multi.test.ts \
            tests/oauth/oauth-anthropic-identity.test.ts \
            tests/config/config-load-degrade.test.ts \
            tests/providers/provider-registry-parity.test.ts \
            tests/routing/fastwire-policy.test.ts; do
            bun test "$file"
          done
      - name: Helper and surface contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            tests/cli/cli-anthropic2-account.test.ts \
            tests/codex-integration/anthropic2-catalog.test.ts \
            tests/providers/provider-anthropic-instance-quota.test.ts \
            tests/server/anthropic2-management.test.ts \
            tests/server/sidecar-anthropic-instance-settings.test.ts \
            tests/usage/anthropic2-usage-attribution.test.ts \
            tests/vision/vision-anthropic-instance-sidecar.test.ts \
            tests/web-search/web-search-anthropic-instance.test.ts \
            tests/server/management-anthropic-reset-grants.test.ts \
            tests/claude-integration/claude-sidecar-override.test.ts; do
            bun test "$file"
          done
      - name: GUI surface contracts
        working-directory: gui
        run: bun test --isolate tests/anthropic2-provider-mark.test.ts tests/anthropic-instance-helper-controls.test.tsx tests/anthropic-reset-grants.test.tsx tests/claude-code-save.test.ts tests/claude-code-sidecar.test.ts tests/provider-account-pause-refresh.test.tsx
