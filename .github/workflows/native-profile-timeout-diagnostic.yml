name: Native profile timeout patch finalizer

on:
  push:
    branches:
      - fix/native-profile-transaction-timeout

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Apply scoped timeout budget
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/native-profile-manager.test.ts")
          text = path.read_text()
          title = "preserves exact auth bytes, encrypts inactive profiles, and leaves task/history files untouched"
          start_line = f'  test("{title}", async () => {{'
          next_test = '\n\n  test("a read-back mismatch restores the exact source and removes the journal"'
          comment = (
              "  // The manager can spend up to 5 s acquiring its SQLite transaction lock.\n"
              "  // Keep Bun's harness budget above that internal deadline so CI load cannot\n"
              "  // pre-empt the manager's own timeout handling.\n"
          )

          start = text.index(start_line)
          end = text.index(next_test, start)
          block = text[start:end]
          if not block.endswith("\n  });"):
              raise SystemExit("target test ending changed unexpectedly")
          block = comment + block[:-len("\n  });")] + "\n  }, 10_000);"
          text = text[:start] + block + text[end:]
          path.write_text(text)
          PY

          git diff --check
          git diff -- tests/native-profile-manager.test.ts

      - name: Commit scoped fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/native-profile-manager.test.ts
          git commit -m "test: align native profile transaction timeout budget"
          git push origin HEAD:${GITHUB_REF_NAME}
