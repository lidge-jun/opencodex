name: Native profile timeout diagnostic

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-repeat:
    name: isolated repeat (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run target test 20 times and capture wall time
        shell: bash
        run: |
          set -uo pipefail
          pattern='preserves exact auth bytes, encrypts inactive profiles, and leaves task/history files untouched'
          failures=0
          printf 'run,duration_ms,status\n'
          for i in {1..20}; do
            started=$(bun -e 'console.log(Date.now())')
            set +e
            output=$(bun test --isolate ./tests/native-profile-manager.test.ts --test-name-pattern "$pattern" 2>&1)
            status=$?
            set -e
            ended=$(bun -e 'console.log(Date.now())')
            duration=$((ended - started))
            printf '%d,%d,%d\n' "$i" "$duration" "$status"
            printf '%s\n' "$output"
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
            fi
          done
          printf 'failures=%d\n' "$failures"
          test "$failures" -eq 0

  file-repeat:
    name: full file repeat (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run native profile manager file 5 times
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          printf 'run,duration_ms,status\n'
          for i in {1..5}; do
            started=$(bun -e 'console.log(Date.now())')
            set +e
            output=$(bun test --isolate ./tests/native-profile-manager.test.ts 2>&1)
            status=$?
            set -e
            ended=$(bun -e 'console.log(Date.now())')
            duration=$((ended - started))
            printf '%d,%d,%d\n' "$i" "$duration" "$status"
            printf '%s\n' "$output"
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
            fi
          done
          printf 'failures=%d\n' "$failures"
          test "$failures" -eq 0
