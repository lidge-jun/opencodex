name: CL-09 review remediation

on:
  push:
    branches:
      - feat/cl-09-passive-production-evidence

concurrency:
  group: cl09-review-remediation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fix:
    name: apply and validate CL-09 review fixes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write # Required only to publish the validated remediation commit.
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Apply focused review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1. Propagate the selected config directory through the existing bounded usage reader.
          replace_once(
              "src/usage/log.ts",
              'export function usageLogPath(): string {\n  return join(getConfigDir(), "usage.jsonl");\n}',
              'export function usageLogPath(configDir?: string): string {\n  return join(configDir ?? getConfigDir(), "usage.jsonl");\n}',
          )
          replace_once(
              "src/usage/log.ts",
              'export function readRecentUsageEntries(limit: number): PersistedUsageEntry[] {\n  if (!Number.isFinite(limit) || limit <= 0) return [];\n  const path = usageLogPath();',
              'export function readRecentUsageEntries(limit: number, configDir?: string): PersistedUsageEntry[] {\n  if (!Number.isFinite(limit) || limit <= 0) return [];\n  const path = usageLogPath(configDir);',
          )

          # 2. Make passive-query truncation observable and exact.
          passive = Path("src/lab/query/passive-production.ts")
          text = passive.read_text(encoding="utf-8")
          old = '''  const maxResults = boundedLimit(limit);\n  const signals: PassiveRouteSignalV1[] = [];\n  const scanRows = entries.slice(-PASSIVE_PRODUCTION_MAX_SCAN_ROWS);\n\n  for (let rowIndex = scanRows.length - 1; rowIndex >= 0 && signals.length < maxResults; rowIndex--) {\n    const entry = scanRows[rowIndex]!;\n    const attempts = entry.attempts ?? [];\n    for (let attemptIndex = attempts.length - 1; attemptIndex >= 0 && signals.length < maxResults; attemptIndex--) {\n      const signal = signalFor(entry, attempts[attemptIndex]!);\n      if (signal?.subjectId === subjectId) signals.push(signal);\n    }\n  }\n'''
          new = '''  const maxResults = boundedLimit(limit);\n  const signals: PassiveRouteSignalV1[] = [];\n  // readRecentUsageEntries returns the selected append-only rows oldest-first.\n  // Tail selection, reverse iteration, and signals[0] as the newest observation rely on this ordering.\n  const scanRows = entries.slice(-PASSIVE_PRODUCTION_MAX_SCAN_ROWS);\n  const scanTruncated = entries.length > PASSIVE_PRODUCTION_MAX_SCAN_ROWS;\n  let resultTruncated = false;\n\n  scan: for (let rowIndex = scanRows.length - 1; rowIndex >= 0; rowIndex--) {\n    const entry = scanRows[rowIndex]!;\n    const attempts = entry.attempts ?? [];\n    for (let attemptIndex = attempts.length - 1; attemptIndex >= 0; attemptIndex--) {\n      const signal = signalFor(entry, attempts[attemptIndex]!);\n      if (signal?.subjectId !== subjectId) continue;\n      if (signals.length >= maxResults) {\n        resultTruncated = true;\n        break scan;\n      }\n      signals.push(signal);\n    }\n  }\n'''
          if text.count(old) != 1:
              raise SystemExit("passive derivation loop changed; refusing broad edit")
          text = text.replace(old, new, 1)
          text = text.replace(
              '    truncated: entries.length > PASSIVE_PRODUCTION_MAX_SCAN_ROWS || signals.length === maxResults,',
              '    truncated: scanTruncated || resultTruncated,',
              1,
          )
          old_query = '''export function queryPassiveProductionSignals(\n  subjectId: string,\n  limit?: number,\n): PassiveProductionQueryResultV1 {\n  return derivePassiveProductionSignals(\n    readRecentUsageEntries(PASSIVE_PRODUCTION_MAX_SCAN_ROWS),\n    subjectId,\n    limit,\n  );\n}\n'''
          new_query = '''export function queryPassiveProductionSignals(\n  subjectId: string,\n  limit?: number,\n  configDir?: string,\n): PassiveProductionQueryResultV1 {\n  return derivePassiveProductionSignals(\n    // Read one row past the scan cap so the projection can distinguish an exact-cap history\n    // from a history with older rows omitted by the bounded reader.\n    readRecentUsageEntries(PASSIVE_PRODUCTION_MAX_SCAN_ROWS + 1, configDir),\n    subjectId,\n    limit,\n  );\n}\n'''
          if text.count(old_query) != 1:
              raise SystemExit("passive query entry point changed; refusing broad edit")
          passive.write_text(text.replace(old_query, new_query, 1), encoding="utf-8")

          replace_once(
              "src/cli/lab.ts",
              '          const result = queryPassiveProductionSignals(subjectId, limit);',
              '          const result = queryPassiveProductionSignals(subjectId, limit, configDir);',
          )

          # 3. Memoize successful installation-salt reads on the production subject-link path.
          salt = Path("src/lab/subject/installation-salt.ts")
          text = salt.read_text(encoding="utf-8")
          text = text.replace(
              'const SALT_BYTES = 32;\nconst UNSUPPORTED_DIRECTORY_FSYNC_CODES',
              'const SALT_BYTES = 32;\nconst installationSaltCache = new Map<string, Uint8Array>();\nconst UNSUPPORTED_DIRECTORY_FSYNC_CODES',
              1,
          )
          old_existing = '''/** Read the existing local fingerprint salt without creating Lab state. */\nexport function readExistingInstallationSalt(configDir?: string): Uint8Array | null {\n  const path = labInstallationSaltPath(configDir);\n  try {\n    return readSaltFile(path);\n  } catch (error) {\n    if ((error as NodeJS.ErrnoException).code === "ENOENT") return null;\n    throw error;\n  }\n}\n'''
          new_existing = '''function cacheSalt(path: string, salt: Uint8Array): Uint8Array {\n  const cached = new Uint8Array(salt);\n  installationSaltCache.set(path, cached);\n  return new Uint8Array(cached);\n}\n\n/** Read the existing local fingerprint salt without creating Lab state. */\nexport function readExistingInstallationSalt(configDir?: string): Uint8Array | null {\n  const path = labInstallationSaltPath(configDir);\n  const cached = installationSaltCache.get(path);\n  if (cached) return new Uint8Array(cached);\n  try {\n    return cacheSalt(path, readSaltFile(path));\n  } catch (error) {\n    if ((error as NodeJS.ErrnoException).code === "ENOENT") return null;\n    throw error;\n  }\n}\n'''
          if text.count(old_existing) != 1:
              raise SystemExit("installation-salt read path changed; refusing broad edit")
          text = text.replace(old_existing, new_existing, 1)
          text = text.replace('  try { return readSaltFile(path); }', '  try { return cacheSalt(path, readSaltFile(path)); }', 1)
          text = text.replace('      return new Uint8Array(salt);', '      return cacheSalt(path, salt);', 1)
          text = text.replace('      return readSaltFile(path);', '      return cacheSalt(path, readSaltFile(path));', 1)
          salt.write_text(text, encoding="utf-8")

          # 4. Focused regressions for classification, truncation, and non-default config directories.
          tests = Path("tests/lab-passive-production-evidence.test.ts")
          text = tests.read_text(encoding="utf-8")
          text = text.replace(
              'import { readFileSync } from "node:fs";\n',
              'import { mkdtempSync, readFileSync, rmSync, writeFileSync } from "node:fs";\nimport { tmpdir } from "node:os";\nimport { join } from "node:path";\n',
              1,
          )
          text = text.replace(
              '  derivePassiveProductionSignals,\n} from "../src/lab/query/passive-production";',
              '  derivePassiveProductionSignals,\n  queryPassiveProductionSignals,\n} from "../src/lab/query/passive-production";',
              1,
          )
          anchor = '''  test("bounds result count and scanned source rows", () => {\n'''
          additions = '''  test("classifies cancellation, environmental failures, and route errors independently", () => {\n    const subjectId = "4".repeat(64);\n    const cancelled = usageEntryWithAttempt({ labRouteSubjectId: subjectId, status: 499 });\n    cancelled.status = 499;\n    cancelled.closeReason = "client_cancel";\n\n    const environmental = usageEntryWithAttempt({\n      labRouteSubjectId: subjectId,\n      status: 429,\n      errorCode: "rate_limit_error",\n    });\n    environmental.requestId = "ocx-cl09-environmental";\n    environmental.status = 429;\n\n    const routeError = usageEntryWithAttempt({\n      labRouteSubjectId: subjectId,\n      status: 502,\n      errorCode: "upstream_error",\n    });\n    routeError.requestId = "ocx-cl09-route-error";\n    routeError.status = 502;\n\n    const result = derivePassiveProductionSignals([cancelled, environmental, routeError], subjectId);\n\n    expect(result.signals.map(signal => signal.outcome).sort()).toEqual([\n      "client_cancel",\n      "environmental",\n      "route_error",\n    ]);\n    expect(result.summary.recentRouteErrorSignals).toBe(1);\n  });\n\n  test("reports result truncation only when another matching signal exists", () => {\n    const subjectId = "5".repeat(64);\n    const entries = Array.from({ length: 3 }, (_, index) => {\n      const entry = usageEntryWithAttempt({ labRouteSubjectId: subjectId });\n      entry.requestId = `ocx-cl09-limit-${index}`;\n      entry.timestamp = index;\n      return entry;\n    });\n\n    expect(derivePassiveProductionSignals(entries.slice(0, 2), subjectId, 2).truncated).toBe(false);\n    expect(derivePassiveProductionSignals(entries, subjectId, 2).truncated).toBe(true);\n  });\n\n  test("uses the selected config directory and detects scan overflow", () => {\n    const configDir = mkdtempSync(join(tmpdir(), "ocx-cl09-passive-"));\n    try {\n      const subjectId = "6".repeat(64);\n      const otherSubjectId = "7".repeat(64);\n      const entries = Array.from({ length: PASSIVE_PRODUCTION_MAX_SCAN_ROWS + 1 }, (_, index) => {\n        const entry = usageEntryWithAttempt({\n          labRouteSubjectId: index === PASSIVE_PRODUCTION_MAX_SCAN_ROWS ? subjectId : otherSubjectId,\n        });\n        entry.requestId = `ocx-cl09-config-${index}`;\n        entry.timestamp = index;\n        return entry;\n      });\n      writeFileSync(join(configDir, "usage.jsonl"), `${entries.map(entry => JSON.stringify(entry)).join("\\n")}\\n`);\n\n      const result = queryPassiveProductionSignals(subjectId, 10, configDir);\n\n      expect(result.signals).toHaveLength(1);\n      expect(result.scannedRows).toBe(PASSIVE_PRODUCTION_MAX_SCAN_ROWS);\n      expect(result.truncated).toBe(true);\n      expect(result.signals[0]?.requestRef).toBe(`ocx-cl09-config-${PASSIVE_PRODUCTION_MAX_SCAN_ROWS}`);\n    } finally {\n      rmSync(configDir, { recursive: true, force: true });\n    }\n  });\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("passive test anchor changed; refusing broad edit")
          text = text.replace(anchor, additions + anchor, 1)
          text = text.replace(
              '    expect(source).not.toContain("readRecentUsageEntries");\n  });',
              '    expect(source).not.toContain("readRecentUsageEntries");\n    const cliSource = readFileSync("src/cli/lab.ts", "utf8");\n    expect(cliSource).toContain("queryPassiveProductionSignals(subjectId, limit, configDir)");\n  });',
              1,
          )
          tests.write_text(text, encoding="utf-8")

          # 5. Reconcile the authoritative CL-09 lifecycle records with the implemented PR.
          status = Path("devlog/_plan/260807_compatibility_lab/001_pr_stack_status.md")
          text = status.read_text(encoding="utf-8")
          old_row = '| CL-09 | `feat/cl-09-passive-production-evidence` | `3b8f9487676fe258d76295e49e7db75aca26a4cb` | CONTRACT DRAFT | [#1489](https://github.com/lidge-jun/opencodex/pull/1489) | CONTRACT REVIEW; runtime implementation not authorized |'
          new_row = '| CL-09 | `feat/cl-09-passive-production-evidence` | `3b8f9487676fe258d76295e49e7db75aca26a4cb` | IMPLEMENTATION REVIEW CANDIDATE | [#1489](https://github.com/lidge-jun/opencodex/pull/1489) | IMPLEMENTED; independent final review and merge acceptance pending |'
          if text.count(old_row) != 1:
              raise SystemExit("CL-09 phase row changed; refusing broad edit")
          text = text.replace(old_row, new_row, 1)
          old_auth = '- CL-09: **CONTRACT DRAFT** via [#1489](https://github.com/lidge-jun/opencodex/pull/1489), based exactly on CL-08 merge `3b8f9487676fe258d76295e49e7db75aca26a4cb`; runtime implementation is not authorized until contract review.'
          new_auth = '- CL-09: **IMPLEMENTED / REVIEW PENDING** via [#1489](https://github.com/lidge-jun/opencodex/pull/1489); the phase started from CL-08 merge `3b8f9487676fe258d76295e49e7db75aca26a4cb`, runtime work was rebased to then-current `dev@e8db4e0365b12a314d1c08ec2cf81599efe5b2d3`, and independent final review plus merge acceptance remain pending.'
          if text.count(old_auth) != 1:
              raise SystemExit("CL-09 authorization entry changed; refusing broad edit")
          status.write_text(text.replace(old_auth, new_auth, 1), encoding="utf-8")

          contract = Path("devlog/_plan/260807_compatibility_lab/009_cl09_passive_production_evidence.md")
          text = contract.read_text(encoding="utf-8")
          text = text.replace(
              'The CL-09 contract was frozen first on this branch. Runtime implementation now proceeds under this contract and remains subject to independent final review before merge.',
              'The CL-09 contract was frozen first on this branch. Runtime implementation is now complete on this branch and remains subject to independent final review before merge.',
              1,
          )
          text = text.replace(
              'No runtime implementation.\n\n## CL-09.1 - Exact attempt subject linkage',
              'No runtime implementation was part of CL-09.0; CL-09.1 through CL-09.4 are implemented later on this PR.\n\n## CL-09.1 - Exact attempt subject linkage',
              1,
          )
          contract.write_text(text, encoding="utf-8")

          plan = Path("docs/superpowers/plans/2026-08-12-cl09-passive-production-evidence.md")
          text = plan.read_text(encoding="utf-8")
          text = text.replace(
              '**Current base:** `dev@e8db4e0365b12a314d1c08ec2cf81599efe5b2d3`',
              '**Current base:** `dev@e8db4e0365b12a314d1c08ec2cf81599efe5b2d3`, a later `dev` descendant of the CL-08 merge `3b8f9487676fe258d76295e49e7db75aca26a4cb` used as the implementation snapshot.',
              1,
          )
          text = text.replace(
              'PR #1489 remains draft and must not be merged before independent final review.',
              'PR #1489 remains open and must not be merged before independent final review.',
              1,
          )
          plan.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile

      - name: Validate focused remediation
        shell: bash
        run: |
          set -euo pipefail
          bun test tests/lab-passive-production-evidence.test.ts tests/usage-log.test.ts
          bun x tsc --noEmit
          bun run privacy:scan
          git diff --check

      - name: Commit fixes and remove helper workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/usage/log.ts \
            src/lab/query/passive-production.ts \
            src/cli/lab.ts \
            src/lab/subject/installation-salt.ts \
            tests/lab-passive-production-evidence.test.ts \
            devlog/_plan/260807_compatibility_lab/001_pr_stack_status.md \
            devlog/_plan/260807_compatibility_lab/009_cl09_passive_production_evidence.md \
            docs/superpowers/plans/2026-08-12-cl09-passive-production-evidence.md
          git rm .github/workflows/cl09-rabbit-remediation.yml
          git diff --cached --check
          git commit -m "fix(lab): address CL-09 review findings"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
