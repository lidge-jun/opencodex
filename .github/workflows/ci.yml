name: Track 3 documentation build proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 6401e2393d6214a8d860aec1fbc8019eb8e7734c
          persist-credentials: false
      - name: Assert exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = 6401e2393d6214a8d860aec1fbc8019eb8e7734c
      - uses: ./.github/actions/setup-project-bun
      - name: Install locked documentation dependencies
        working-directory: docs-site
        run: bun install --frozen-lockfile
      - name: Build documentation without deploying
        working-directory: docs-site
        run: bun run build
