name: Track2 shim budget diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preparation:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: c7a96b14f27c127e2e59f75a9daabd3fce306a5c
          persist-credentials: false
          fetch-tags: true
      - uses: ./.github/actions/setup-project-bun
      - name: Existing fixture inputs
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          (cd gui && bun install --frozen-lockfile && bun run build)
      - name: Real CLI budget and advisory controls
        shell: bash
        run: |
          python - <<'PYCODE'
          import json,re,subprocess,sys
          from pathlib import Path
          fixture=Path("tests/codex-integration/codex-shim-readiness.test.ts")
          production=Path("src/cli/codex-shim-readiness.ts")
          out=Path(".tmp/shim-budget-diagnostics");out.mkdir(parents=True,exist_ok=True)
          original=fixture.read_bytes();prod_original=production.read_bytes()
          base=fixture.read_text()
          def once(s,a,b):
              assert s.count(a)==1, "Pinned source anchor drifted"
              return s.replace(a,b,1)
          prefix,case=base.split('  test("keeps install advisory when the Codex config cannot be read"',1)
          opening='  test("keeps install advisory when the Codex config cannot be read"'
          needle='      expect(result.status).toBe(0);'
          common=once(case,needle,'      console.log("SHIM_CHILD_RESULT", JSON.stringify({status:result.status,signalled:result.signal!==null,errored:Boolean(result.error)}));\n      try {\n'+needle)
          needle='      expect(result.stderr).toContain("Codex routing could not be verified");'
          common=once(common,needle,needle+'\n      } catch (error) { console.log("SHIM_SEMANTIC_ASSERTION_FAILED"); throw error; }')
          needle='      const result = spawnSync(process.execPath, [cliPath, "codex-shim", "install"], {'
          delay='      const delayPath = join(root, "diagnostic-delay.ts");\n      writeFileSync(delayPath, "await Bun.sleep(12000);\\n", "utf8");\n'
          late=once(common,needle,delay+'      const result = spawnSync(process.execPath, ["--preload", delayPath, cliPath, "codex-shim", "install"], {')
          new=once(late,'        encoding: "utf8",','        encoding: "utf8",\n        timeout: process.platform === "win32" ? SPAWN_BUDGET_MS : undefined,\n        killSignal: "SIGKILL",')
          new=once(new,'  }, 10_000);','  }, process.platform === "win32" ? SPAWN_BUDGET_MS + 5_000 : 10_000);')
          # Re-open the same source before the describe block so this is a top-level import.
          new_prefix=once(prefix,'import { removeTreeWithRetry } from "../helpers/remove-tree";','import { removeTreeWithRetry } from "../helpers/remove-tree";\nimport { SPAWN_BUDGET_MS } from "../helpers/test-budget";')
          mutant=once(prod_original.decode(),'  } catch {\n    // Routing readiness is advisory;','  } catch {\n    throw new Error("diagnostic broken advisory");\n    // Routing readiness is advisory;')
          results={}
          def sample(label,text,prod=prod_original):
              fixture.write_text(text);production.write_bytes(prod)
              with (out/(label+".log")).open("wb") as log:
                  p=subprocess.Popen(["bun","test","--isolate","--timeout","60000",str(fixture),"--test-name-pattern","keeps install advisory when the Codex config cannot be read"],stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  for line in p.stdout:
                      log.write(line);log.flush();sys.stdout.buffer.write(line);sys.stdout.buffer.flush()
                  code=p.wait()
              logtext=re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]","",(out/(label+".log")).read_text(errors="replace"))
              events=[]
              for line in logtext.splitlines():
                  if line.startswith("SHIM_CHILD_RESULT "):
                      events.append(json.loads(line[len("SHIM_CHILD_RESULT "):]))
              timed=bool(re.search(r"this test timed out|TimeoutError|ETIMEDOUT",logtext))
              semantic="SHIM_SEMANTIC_ASSERTION_FAILED" in logtext and bool(re.search(r"error:\s*expect\(",logtext))
              results[label]={"exit":code,"events":events,"timeout":timed,"semanticFailure":semantic}
              (out/"outcomes.json").write_text(json.dumps(results,indent=2))
          try:
              sample("control",prefix+opening+common)
              sample("late-old",prefix+opening+late)
              sample("late-new",new_prefix+opening+new)
              sample("late-new-mutant",new_prefix+opening+new,mutant.encode())
          finally:
              fixture.write_bytes(original);production.write_bytes(prod_original)
              assert fixture.read_bytes()==original and production.read_bytes()==prod_original
          def completed(r,code):
              return any(e["status"]==code and not e["signalled"] and not e["errored"] for e in r["events"])
          control=results["control"];old=results["late-old"];new=results["late-new"];bad=results["late-new-mutant"]
          valid=(control["exit"]==0 and completed(control,0) and not control["timeout"]
                 and old["exit"]!=0 and old["timeout"] and not completed(old,0)
                 and new["exit"]==0 and completed(new,0) and not new["timeout"]
                 and bad["exit"]!=0 and completed(bad,1) and bad["semanticFailure"] and not bad["timeout"])
          (out/"verdict.json").write_text(json.dumps({"diagnosticOnly":True,"budgetAndAdvisoryControl":valid},indent=2))
          if not valid: raise RuntimeError("Shim budget or advisory mutation control inconclusive")
          PYCODE
      - name: Retain outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shim-budget-controls
          path: .tmp/shim-budget-diagnostics
          include-hidden-files: true
          if-no-files-found: warn
