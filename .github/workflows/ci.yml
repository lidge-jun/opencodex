name: Track2 held sync diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: track2-held-sync-diagnostics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  held-sync:
    name: held sync (${{ matrix.label }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            head: 24c761a052957883f9279c291b16194f91affcc3
          - label: prior
            head: d60a0716d27a284f91631297bed4003c479f6298
          - label: current
            head: 84c94f3d774d64b8b05ae2193485348f20fc17c1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ matrix.head }}
          persist-credentials: false
          fetch-tags: true
      - uses: ./.github/actions/setup-project-bun
      - name: Existing fixture inputs
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object tests/codex-integration/codex-composed-acceptance.test.ts
          bun install --frozen-lockfile
          (cd gui && bun install --frozen-lockfile && bun run build)
          mkdir -p .tmp/held-sync-diagnostics
      - name: Unmodified B sample
        id: original
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun test --isolate --timeout 60000 tests/codex-integration/codex-composed-acceptance.test.ts --test-name-pattern 'B-reduced' 2>&1 | tee .tmp/held-sync-diagnostics/original.log
      - name: Fixed diagnostic markers only
        id: markers
        if: always() && steps.original.outcome != 'skipped'
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          p=Path("tests/codex-integration/codex-composed-acceptance.test.ts")
          s=p.read_text()
          needle="    const response = await fetch(" + chr(96) + "http://127.0.0.1:${runtime.port}${path}" + chr(96) + ", {"
          assert s.count(needle)==1
          prefix='''    const diagnosticStart = performance.now();
              console.log("HELD_DIAG", JSON.stringify({ phase: "request.begin", path, timeoutMs, at: performance.now() }));
              const diagnosticSignal = AbortSignal.timeout(timeoutMs);
              const onDiagnosticAbort = () => console.log("HELD_DIAG", JSON.stringify({ phase: "request.abort", path, timeoutMs, elapsed: performance.now()-diagnosticStart, at: performance.now() }));
              diagnosticSignal.addEventListener("abort", onDiagnosticAbort, { once: true });
          '''
          s=s.replace(needle,prefix+needle,1)
          s=s.replace("signal: AbortSignal.timeout(timeoutMs),","signal: diagnosticSignal,",1)
          old="    return { status: response.status, body: await response.json() as Record<string, unknown> };"
          assert old in s
          s=s.replace(old,'''    const body = await response.json() as Record<string, unknown>;
              diagnosticSignal.removeEventListener("abort", onDiagnosticAbort);
              console.log("HELD_DIAG", JSON.stringify({ phase: "request.end", path, status: response.status, elapsed: performance.now()-diagnosticStart, at: performance.now() }));
              return { status: response.status, body };''',1)
          needle="            entered();\n            await released;"
          assert needle in s
          s=s.replace(needle,'            console.log("HELD_DIAG", JSON.stringify({ phase: "provider.enter", at: performance.now() }));\n'+needle+'\n            console.log("HELD_DIAG", JSON.stringify({ phase: "provider.release", at: performance.now() }));',1)
          start=s.index('  test("B-reduced:')
          end=s.index("\n  /** RED:",start)
          block=s[start:end]
          needle="      const server = await fx.start();"
          assert needle in block
          block=block.replace(needle,'      console.log("HELD_DIAG", JSON.stringify({ phase: "server.start", at: performance.now() }));\n'+needle+'\n      console.log("HELD_DIAG", JSON.stringify({ phase: "server.ready", at: performance.now() }));',1)
          p.write_text(s[:start]+block+s[end:])
          print("Diagnostic logging only: unchanged deadlines and assertions.")
          PYCODE
      - name: Two predetermined traced samples
        id: traced
        if: always() && steps.markers.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          failed=0
          for sample in 1 2; do
            bun test --isolate --timeout 60000 tests/codex-integration/codex-composed-acceptance.test.ts --test-name-pattern 'B-reduced' 2>&1 | tee ".tmp/held-sync-diagnostics/traced-${sample}.log"
            result=${PIPESTATUS[0]}
            echo "TRACE_SAMPLE=${sample} EXIT=${result}"
            if [ "$result" -ne 0 ]; then failed=$((failed+1)); fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          test "$failed" -eq 0
      - name: Whole-file context when isolated samples pass
        id: whole
        if: always() && steps.original.outcome == 'success' && steps.traced.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun test --isolate --timeout 60000 tests/codex-integration/codex-composed-acceptance.test.ts 2>&1 | tee .tmp/held-sync-diagnostics/whole.log
      - name: Preserve all outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: held-sync-${{ matrix.label }}
          path: .tmp/held-sync-diagnostics
          if-no-files-found: warn
      - name: Diagnostic outcome, not integration proof
        if: always()
        shell: bash
        env:
          ORIGINAL: ${{ steps.original.outcome }}
          TRACED: ${{ steps.traced.outcome }}
          WHOLE: ${{ steps.whole.outcome }}
        run: |
          printf 'original=%s traced=%s whole=%s\n' "$ORIGINAL" "$TRACED" "$WHOLE"
          test "$ORIGINAL" = success
          test "$TRACED" = success
          test "$WHOLE" = success
