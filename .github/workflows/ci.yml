name: Cross-platform CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-windows-fixture:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project-bun
      - name: Install dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile
      - name: Compare test file selection
        shell: bash
        run: |
          mkdir -p .tmp
          cat > .tmp/windows-fixture-probe.ts <<'JS'
          import { mkdtempSync, writeFileSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join, resolve } from 'node:path';
          import { spawnSync } from 'node:child_process';
          const preload = resolve('tests/preload.ts');
          const root = mkdtempSync(join(tmpdir(), 'ocx-fixture-path-probe-'));
          const name = 'fixture.test.ts';
          writeFileSync(join(root, name), 'import { test } from "bun:test"; test("sentinel", () => { console.log("fixture_sentinel"); });');
          try {
            for (const form of ['absolute', 'relative', 'absolute']) {
              const p = spawnSync(process.execPath, ['test', '--preload', preload, form === 'absolute' ? join(root, name) : './' + name], { cwd: root, encoding: 'utf8', timeout: 20000 });
              console.log(JSON.stringify({ form, status: p.status, signal: p.signal, sentinel: p.stdout.includes('fixture_sentinel'), noTests: /No tests found|did not match any test files/i.test(p.stderr), preloadError: /preload.*not found|cannot find.*preload/i.test(p.stderr) }));
              if (form === 'relative' && (p.status !== 0 || !p.stdout.includes('fixture_sentinel'))) process.exitCode = 1;
            }
          } finally { rmSync(root, { recursive: true, force: true }); }
          JS
          bun .tmp/windows-fixture-probe.ts
      - name: Original lifecycle scenarios must reproduce failure
        shell: bash
        run: |
          if bun test --isolate --timeout 60000 ./tests/clients/client-connect.test.ts --test-name-pattern 'Desktop copy coherence'; then
            echo 'Expected baseline failure did not reproduce'; exit 1
          fi
      - name: Change only fixture argument to explicit relative path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/clients/client-connect.test.ts')
          s = p.read_text()
          old = 'join(repoRoot, "tests/preload.ts"), fixturePath]'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'join(repoRoot, "tests/preload.ts"), "./client-lifecycle-fixture.test.ts"]'))
          PY
          bun test --isolate --timeout 60000 ./tests/clients/client-connect.test.ts --test-name-pattern 'Desktop copy coherence'
      - name: Restore absolute argument and confirm failure returns
        shell: bash
        run: |
          git restore tests/clients/client-connect.test.ts
          if bun test --isolate --timeout 60000 ./tests/clients/client-connect.test.ts --test-name-pattern 'Desktop copy coherence'; then
            echo 'Expected restored failure did not reproduce'; exit 1
          fi
