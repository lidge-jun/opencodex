name: Track2 sync budget diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: track2-sync-budget-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preparation:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 0f8936b1f692d72ff1d2c1dd6218183dd0e9b882
          persist-credentials: false
          fetch-tags: true
      - uses: ./.github/actions/setup-project-bun
      - name: Existing fixture inputs
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          bun install --frozen-lockfile
          (cd gui && bun install --frozen-lockfile && bun run build)
      - name: Real preparation, bounded late control and semantic mutation
        shell: bash
        run: |
          python - <<'PYCODE'
          import json,re,subprocess,sys
          from pathlib import Path
          fixture=Path("tests/codex-integration/codex-sync-api.test.ts")
          desired=Path("src/codex/desired-state.ts")
          out=Path(".tmp/sync-budget-diagnostics");out.mkdir(parents=True,exist_ok=True)
          original=fixture.read_bytes();desired_original=desired.read_bytes()
          base=fixture.read_text()
          def once(s,a,b):
              assert s.count(a)==1, "Pinned source anchor drifted"
              return s.replace(a,b,1)
          marker="'  const snapshot = loadConfig(); // admitted BEFORE the flip: reads as ON',"
          common=once(base,marker,"'  console.log(\"SYNC_DIAG\", JSON.stringify({phase:\"load.begin\",at:Date.now()}));',\n"+marker+"\n'  console.log(\"SYNC_DIAG\", JSON.stringify({phase:\"load.end\",at:Date.now()}));',")
          parent_marker='      if (child.error || child.signal !== null || child.status !== 0) {'
          common=once(common,parent_marker,'      for (const diagnostic of child.stdout.split("\\n")) { if (diagnostic.startsWith("SYNC_DIAG ")) console.log(diagnostic); }\n'+parent_marker)
          assertion_start='      expect(JSON.parse(line)).toMatchObject({ status: "skipped", skippedReason: "desired_disabled", ok: true });'
          assertion_end='      expect(readFileSync(join(raceCodexHome, "config.toml"), "utf8")).toBe(before);'
          common=once(common,assertion_start,'      try {\n'+assertion_start)
          common=once(common,assertion_end,assertion_end+'\n      } catch (error) { console.log("SYNC_SEMANTIC_ASSERTION_FAILED"); throw error; }')
          needle="'    refreshCodexModelCatalog: async () => {',"
          common=once(common,needle,needle+"\n'      console.log(\"SYNC_DIAG\", JSON.stringify({phase:\"discovery.enter\",at:Date.now(),remaining:Number(process.env.OCX_TEST_COMPETING_OFF_DEADLINE)-Date.now()}));',")
          needle="'      const flip = spawnSync(process.execPath, [\"--eval\",',"
          common=once(common,needle,"'      console.log(\"SYNC_DIAG\", JSON.stringify({phase:\"flip.begin\",at:Date.now()}));',\n"+needle)
          needle="'      if (flip.error || flip.signal !== null || flip.status !== 0) {',"
          common=once(common,needle,"'      console.log(\"SYNC_DIAG\", JSON.stringify({phase:\"flip.end\",at:Date.now(),status:flip.status,signalled:flip.signal!==null}));',\n"+needle)
          needle="'      const remainingMs = Number(process.env.OCX_TEST_COMPETING_OFF_DEADLINE) - Date.now();',"
          floor="'      const outerStart = Number(process.env.OCX_TEST_COMPETING_OFF_DEADLINE) - Number(process.env.OCX_TEST_COMPETING_OFF_INITIAL_MS);',\n'      await new Promise(resolve => setTimeout(resolve, Math.max(0, outerStart + 52000 - Date.now())));',\n'      console.log(\"SYNC_DIAG\", JSON.stringify({phase:\"prepared\",elapsed:Date.now()-outerStart,at:Date.now()}));',\n"
          late=once(common,needle,floor+needle)
          needle="          OCX_TEST_COMPETING_OFF_DEADLINE: String(Date.now() + COMPETING_OFF_CHILD_MS),"
          late=once(late,needle+"\n" if needle+"\n" in late else needle,needle+"\n          OCX_TEST_COMPETING_OFF_INITIAL_MS: String(COMPETING_OFF_CHILD_MS),\n")
          old="const COMPETING_OFF_CHILD_MS = 2 * COMPETING_OFF_BOOT_MS + COMPETING_OFF_REAP_MS;"
          new='const COMPETING_OFF_PREPARATION_MS = process.platform === "win32" ? 2 * COMPETING_OFF_BOOT_MS : COMPETING_OFF_BOOT_MS;\nconst COMPETING_OFF_CHILD_MS = COMPETING_OFF_PREPARATION_MS + COMPETING_OFF_BOOT_MS + COMPETING_OFF_REAP_MS;'
          expanded=once(late,old,new)
          mutant=once(desired_original.decode(),"      integrations[client] = false;","      integrations[client] = client === \"codex\" ? true : false;")
          results={}
          def sample(label,text,production=desired_original):
              fixture.write_text(text);desired.write_bytes(production)
              with (out/(label+".log")).open("wb") as log:
                  p=subprocess.Popen(["bun","test","--isolate","--timeout","60000",str(fixture),"--test-name-pattern","a competing OFF during catalog discovery"],stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  for line in p.stdout:
                      log.write(line);log.flush();sys.stdout.buffer.write(line);sys.stdout.buffer.flush()
                  code=p.wait()
              logtext=re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]","",(out/(label+".log")).read_text(errors="replace"))
              events=[]
              for line in logtext.splitlines():
                  if line.startswith("SYNC_DIAG "):
                      try: events.append(json.loads(line[len("SYNC_DIAG "):]))
                      except json.JSONDecodeError: pass
              budget_refusal="competing OFF flip not started: insufficient remaining budget" in logtext
              timeout=bool(re.search(r"TimeoutError|AbortError|timed out|error=spawnSync[^\n]*ETIMEDOUT",logtext))
              assertion=bool(re.search(r"error:\s*expect\(",logtext))
              flip_completed=any(e.get("phase")=="flip.end" and e.get("status")==0 and e.get("signalled")==False for e in events)
              results[label]={"exit":code,"events":events,"budgetRefusal":budget_refusal,"timeout":timeout,"assertion":assertion,"semanticAssertion":"SYNC_SEMANTIC_ASSERTION_FAILED" in logtext,"flipCompleted":flip_completed}
              (out/"outcomes.json").write_text(json.dumps(results,indent=2))
              print("SAMPLE "+json.dumps({"name":label,**results[label]}),flush=True)
          try:
              sample("control",common)
              sample("late-old",late)
              sample("late-new",expanded)
              sample("late-new-mutant",expanded,mutant.encode())
          finally:
              fixture.write_bytes(original);desired.write_bytes(desired_original)
              assert fixture.read_bytes()==original and desired.read_bytes()==desired_original
          old_result=results["late-old"];new_result=results["late-new"];bad=results["late-new-mutant"]
          control=results["control"]
          valid=(control["exit"]==0 and control["flipCompleted"] and not control["timeout"]
                 and old_result["exit"]!=0 and old_result["budgetRefusal"] and not old_result["flipCompleted"] and not old_result["timeout"]
                 and new_result["exit"]==0 and new_result["flipCompleted"]
                 and bad["exit"]!=0 and bad["flipCompleted"] and bad["assertion"] and bad["semanticAssertion"] and not bad["timeout"] and not bad["budgetRefusal"])
          (out/"verdict.json").write_text(json.dumps({"diagnosticOnly":True,"fullIntegrationProof":False,"budgetAndAssertionControl":valid},indent=2))
          if not valid: raise RuntimeError("Budget adequacy or semantic mutation control is inconclusive")
          PYCODE
      - name: Retain every outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sync-budget-controls
          path: .tmp/sync-budget-diagnostics
          include-hidden-files: true
          if-no-files-found: warn
