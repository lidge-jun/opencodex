name: Cross-platform CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-cursor-blob-cost:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-project-bun
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile
      - name: Measure original store
        continue-on-error: true
        run: |
          git show a349b521bb02f76c7b8820c13633a8076dcec378:src/adapters/cursor/native-exec.ts > src/adapters/cursor/native-exec.ts
          bun test --isolate --timeout 60000 ./tests/providers/cursor/cursor-blob.test.ts --test-name-pattern 'key bytes stay bounded at the 4096-entry ceiling'
      - name: Measure optimized store using unchanged test
        run: |
          git restore src/adapters/cursor/native-exec.ts
          bun test --isolate --timeout 60000 ./tests/providers/cursor/cursor-blob.test.ts --test-name-pattern 'key bytes stay bounded at the 4096-entry ceiling'
      - name: Restore original store and measure again
        continue-on-error: true
        run: |
          git show a349b521bb02f76c7b8820c13633a8076dcec378:src/adapters/cursor/native-exec.ts > src/adapters/cursor/native-exec.ts
          bun test --isolate --timeout 60000 ./tests/providers/cursor/cursor-blob.test.ts --test-name-pattern 'key bytes stay bounded at the 4096-entry ceiling'
