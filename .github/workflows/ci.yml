name: Cross-platform CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  known-folder-emission-prototype:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-tags: true
      - uses: ./.github/actions/setup-project-bun
      - name: Install and build fixture dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile
          bun run build
      - name: Preserve the original reference expression
        shell: bash
        run: |
          mkdir -p .tmp
          bun -e 'import { windowsLocalAppDataExpressionForTests } from "./src/codex/user-identity"; await Bun.write(".tmp/old-known-folder.json", JSON.stringify(windowsLocalAppDataExpressionForTests()));'
      - name: Apply the experimental emitted binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('src/codex/user-identity.ts');s=p.read_text(encoding='utf-8')
          start=s.index('  const signature =',s.index('function windowsLocalAppDataExpression'))
          end=s.index('    `$ocxFolderId =',start)
          statements=[
          "$ocxAssemblyName = New-Object -TypeName System.Reflection.AssemblyName -ArgumentList 'OcxIdentity'",
          "$ocxAssembly = [AppDomain]::CurrentDomain.DefineDynamicAssembly($ocxAssemblyName, [Reflection.Emit.AssemblyBuilderAccess]::Run)",
          "$ocxModule = $ocxAssembly.DefineDynamicModule('OcxKnownFolder')",
          "$ocxType = $ocxModule.DefineType('OcxIdentity.OcxKnownFolder', [Reflection.TypeAttributes]'Public,Sealed,Abstract')",
          "$ocxParameters = [Type[]]@([Guid].MakeByRefType(), [UInt32], [IntPtr], [IntPtr].MakeByRefType())",
          "$ocxDll = [IO.Path]::Combine([Environment]::SystemDirectory, 'shell32.dll')",
          "$ocxMethod = $ocxType.DefinePInvokeMethod('SHGetKnownFolderPath', $ocxDll, 'SHGetKnownFolderPath', [Reflection.MethodAttributes]'Public,Static,PinvokeImpl', [Reflection.CallingConventions]::Standard, [Int32], $ocxParameters, [Runtime.InteropServices.CallingConvention]::Winapi, [Runtime.InteropServices.CharSet]::Unicode)",
          "$ocxMethod.SetImplementationFlags($ocxMethod.GetMethodImplementationFlags() -bor [Reflection.MethodImplAttributes]::PreserveSig)",
          "$null = $ocxMethod.DefineParameter(4, [Reflection.ParameterAttributes]::Out, 'path')",
          "$ocxShell = $ocxType.CreateType()",
          ]
          prefix='  const statements = [\n'+''.join('    '+json.dumps(x)+',\n' for x in statements)
          s=s[:start]+prefix+s[end:]
          s=s.replace('    "if ($ocxHr -ne 0) { throw \'SHGetKnownFolderPath failed\' }",\n    "try { [System.Runtime.InteropServices.Marshal]::PtrToStringUni($ocxPathPtr) }"', '    "try { if ($ocxHr -ne 0) { throw \'SHGetKnownFolderPath failed\' }; [System.Runtime.InteropServices.Marshal]::PtrToStringUni($ocxPathPtr) }"')
          p.write_text(s,encoding='utf-8')
          PY
          cat > .tmp/known-folder-conformance.ts <<'TS'
          import { readFileSync, mkdirSync } from "node:fs";
          import { join } from "node:path";
          import {
            windowsLocalAppDataExpressionForTests,
            windowsIdentityPowerShellCommandForTests,
            windowsIdentityPowerShellSpawnOptionsForTests,
            decodeWindowsIdentityPowerShellOutputForTests,
          } from "../src/codex/user-identity";
          const original = JSON.parse(readFileSync(".tmp/old-known-folder.json", "utf8"));
          const query = (expression: string, env = process.env, legacy = false) => {
            const start = performance.now();
            const child = Bun.spawnSync(windowsIdentityPowerShellCommandForTests(expression), {
              ...windowsIdentityPowerShellSpawnOptionsForTests(), env, ...(legacy ? { timeout: 45_000 } : {}),
            });
            return { child, ms: Math.round(performance.now() - start), value: child.exitCode === 0 ? decodeWindowsIdentityPowerShellOutputForTests(child.stdout) : "" };
          };
          const reference = query(original, process.env, true);
          if (reference.child.exitCode !== 0 || !reference.value) throw new Error("Reference lookup failed");
          const expression = windowsLocalAppDataExpressionForTests();
          const actual = query(expression);
          if (actual.child.exitCode !== 0 || actual.value !== reference.value) throw new Error("Emitted lookup differs from reference");
          const shadow = join(process.cwd(), ".tmp", "shadow-profile");
          mkdirSync(shadow, { recursive: true });
          const shadowed = query(expression, { ...process.env, HOME: shadow, USERPROFILE: shadow, LOCALAPPDATA: shadow, APPDATA: shadow, TEMP: shadow, TMP: shadow });
          if (shadowed.child.exitCode !== 0 || shadowed.value !== reference.value) throw new Error("Emitted lookup followed environment shadow");
          const invalid = expression.replace("F1B32785-6FBA-4FCF-9D55-7B8E7F157091", "00000000-0000-0000-0000-000000000000")
            .replace("if ($ocxHr -ne 0)", "[Console]::Error.WriteLine('OCX_FIXTURE_HRESULT=' + $ocxHr); if ($ocxHr -ne 0)");
          const negative = query(invalid);
          const stderr = new TextDecoder().decode(negative.child.stderr);
          const hr = /OCX_FIXTURE_HRESULT=(-[0-9]+)/.exec(stderr);
          if (negative.child.exitCode === 0 || !hr || Number(hr[1]) >= 0) throw new Error("Native HRESULT refusal was not preserved");
          console.log(JSON.stringify({ referenceMs: reference.ms, emittedMs: actual.ms, shadowedMs: shadowed.ms, samePath: true, shadowIgnored: true, failedHRESULTPreserved: true, productionTimeoutMs: windowsIdentityPowerShellSpawnOptionsForTests().timeout }));
          TS
          bun .tmp/known-folder-conformance.ts
      - name: Run existing identity and Desktop contract tests
        shell: bash
        run: bun test --isolate --timeout 60000 ./tests/codex-integration/codex-user-identity.test.ts ./tests/claude-integration/claude-desktop-remote-hub.test.ts
