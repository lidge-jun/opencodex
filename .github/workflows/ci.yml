name: Track 3 Windows readiness diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: track3-readiness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  readiness-proof:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project-bun
      - name: Controlled source, delay and mutation comparison
        shell: bash
        run: python -u scripts/ci/track3-readiness-probe.py
      - name: Retain diagnostic receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: track3-windows-readiness-proof
          path: .tmp/readiness-proof
