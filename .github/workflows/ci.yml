name: Cross-platform CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-windows-fixture:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project-bun
      - name: Install dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile
      - name: Classify nested fixture startup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/clients/client-connect.test.ts')
          s = p.read_text()
          old = '    const marker = child.stdout.trim().split("\\n").reverse().find(line =>'
          assert s.count(old) == 1
          diagnostic = '''    console.log(JSON.stringify({ fixtureDiagnostic: {
                stdoutBytes: child.stdout.length, stderrBytes: child.stderr.length,
                moduleEntered: child.stdout.includes("fixture_module_entered"),
                preloadEntered: child.stdout.includes("fixture_preload_entered"),
                preloadComplete: child.stdout.includes("fixture_preload_complete"),
                noTests: /No tests found|did not match any test files/i.test(child.stderr),
                syntax: /SyntaxError|Expected|Unexpected token|ParseError/i.test(child.stderr),
                moduleNotFound: /Cannot find|ModuleNotFound|ResolveMessage|not found/i.test(child.stderr),
                runLock: /test.run.lock|test run lock|effective.account|SID|runtime root/i.test(child.stderr),
                guard: /guard|unprotected|protected home/i.test(child.stderr),
                access: /EACCES|EPERM|permission/i.test(child.stderr),
                cliError: /Usage:|unknown option|unrecognized|invalid argument/i.test(child.stderr),
                nestedWorker: !!process.env.BUN_TEST_WORKER_ID,
                bunEnvKeys: Object.keys(process.env).filter(k => k.startsWith("BUN_")).sort(),
              } }));
          '''
          s = s.replace(old, diagnostic + old)
          s = s.replace('writeFileSync(fixturePath, `import { test }', 'writeFileSync(fixturePath, `console.log("fixture_module_entered"); import { test }')
          p.write_text(s)
          preload = Path('tests/preload.ts')
          text = preload.read_text()
          preload.write_text('console.log("fixture_preload_entered");\n' + text + '\nconsole.log("fixture_preload_complete");\n')
          PY
          bun test --isolate --timeout 60000 ./tests/clients/client-connect.test.ts --test-name-pattern 'rotate settles Desktop'
