name: Cross-platform CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-apply-timing:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project-bun
      - name: Install and build fixture dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile
          bun run build
      - name: Reproduce the short outer deadline with a valid slow lookup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/fixtures/claude-desktop-network-guard.ts')
          s=p.read_text()
          trace=r'''
          const tracePath = process.env.OCX_TEST_TIMING_PATH;
          const traceStart = performance.now();
          let traceCount = 0;
          function trace(event: string, detail: Record<string, unknown> = {}) {
            if (tracePath && traceCount++ < 512) appendFileSync(tracePath, JSON.stringify({ event, ms: Math.round(performance.now() - traceStart), ...detail }) + "\n");
          }
          trace("cli_preload");
          const originalSpawnSync = Bun.spawnSync;
          Bun.spawnSync = ((...args: any[]) => {
            const command = Array.isArray(args[0]) ? args[0][0] : args[0]?.cmd?.[0];
            const value = typeof command === "string" ? command.replaceAll("\\", "/").split("/").at(-1)?.toLowerCase() : "";
            const category = value === "icacls.exe" ? "icacls" : value === "powershell.exe" ? "powershell" : value === "reg.exe" ? "registry" : "other";
            const start = performance.now();
            trace("spawn_start", { category });
            try {
              let actualArgs = args;
              if (tracePath && Array.isArray(args[0])) {
                const index = args[0].findIndex((part: unknown) => typeof part === "string" && part.includes("SHGetKnownFolderPath"));
                if (index >= 0) {
                  const cmd = [...args[0]];
                  cmd[index] = "$ocxProbeClock = [Diagnostics.Stopwatch]::StartNew(); " + cmd[index] + "; $ocxProbeLeft = [int](28000 - $ocxProbeClock.Elapsed.TotalMilliseconds); if ($ocxProbeLeft -gt 0) { Start-Sleep -Milliseconds $ocxProbeLeft }";
                  actualArgs = [cmd, ...args.slice(1)];
                  trace("controlled_valid_lookup_delay");
                }
              }
              return originalSpawnSync.apply(Bun, actualArgs);
            }
            finally { trace("spawn_end", { category, durationMs: Math.round(performance.now() - start) }); }
          }) as typeof Bun.spawnSync;
          const originalSpawn = Bun.spawn;
          Bun.spawn = ((...args: any[]) => {
            const command = Array.isArray(args[0]) ? args[0][0] : args[0]?.cmd?.[0];
            const value = typeof command === "string" ? command.replaceAll("\\", "/").split("/").at(-1)?.toLowerCase() : "";
            const category = value === "icacls.exe" ? "icacls" : value === "powershell.exe" ? "powershell" : value === "reg.exe" ? "registry" : "other";
            const start = performance.now();
            trace("async_spawn_start", { category });
            const child = originalSpawn.apply(Bun, args);
            void child.exited.then((code: number) => trace("async_spawn_end", { category, code, durationMs: Math.round(performance.now() - start) }), () => trace("async_spawn_error", { category }));
            return child;
          }) as typeof Bun.spawn;
          const originalExit = process.exit;
          process.exit = ((code?: number) => { trace("process_exit", { code }); return originalExit(code); }) as typeof process.exit;
          '''
          s=s.replace('const nativeFetch = globalThis.fetch;',trace+'\nconst nativeFetch = globalThis.fetch;')
          s=s.replace('    return nativeFetch(...args);','    trace("fetch_start");\n    return nativeFetch(...args).finally(() => trace("fetch_end"));')
          p.write_text(s)
          p=Path('tests/claude-integration/claude-desktop-remote-hub.test.ts');s=p.read_text()
          old='''    const apply = spawnOwned(client, ["claude", "desktop", "apply", "--static"]);
              const appliedCode = await within(apply.child.exited, 30_000, "Remote Desktop apply deadline");'''
          new='''    const traceFile = join(client.root, "apply-timing.jsonl");
              client.env.OCX_TEST_TIMING_PATH = traceFile;
              const applyStart = performance.now();
              const apply = spawnOwned(client, ["claude", "desktop", "apply", "--static"]);
              let appliedCode: number;
              try { appliedCode = await within(apply.child.exited, 30_000, "Remote Desktop apply deadline"); }
              finally {
                const trace = existsSync(traceFile) ? readFileSync(traceFile, "utf8").trim().split("\\n").filter(Boolean).map(line => JSON.parse(line)) : [];
                console.log(JSON.stringify({ applyTiming: { elapsedMs: Math.round(performance.now() - applyStart), alive: apply.child.exitCode === null, trace } }));
              }'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          set +e
          bun test --isolate ./tests/claude-integration/claude-desktop-remote-hub.test.ts --test-name-pattern 'stored profile=true' 2>&1 | tee old-budget.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          grep -F 'Remote Desktop apply deadline' old-budget.log
          grep -F 'controlled_valid_lookup_delay' old-budget.log
      - name: Apply the canonical subprocess budget and verify unchanged assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/claude-integration/claude-desktop-remote-hub.test.ts')
          s=p.read_text()
          s='import { SPAWN_BUDGET_MS } from "../helpers/test-budget";\n'+s
          old='within(apply.child.exited, 30_000, "Remote Desktop apply deadline")'
          assert s.count(old)==1
          p.write_text(s.replace(old,'within(apply.child.exited, SPAWN_BUDGET_MS, "Remote Desktop apply deadline")'))
          PY
          bun test --isolate ./tests/claude-integration/claude-desktop-remote-hub.test.ts --test-name-pattern 'stored profile=true'
      - name: Confirm the model identity assertion still rejects broken production behavior
        shell: bash
        run: |
          git restore tests/fixtures/claude-desktop-network-guard.ts
          python - <<'PY'
          from pathlib import Path
          p=Path('src/cli/claude-desktop.ts')
          s=p.read_text()
          marker='    const result: DesktopStoreResult = withClientLifecycleSync('
          assert s.count(marker)==1
          mutation='    snapshot.models = snapshot.models.map(model => model.name === "claude-opus-4-8-20260211" ? { ...model, name: "claude-opus-4-8-20260911" } : model);\n'
          p.write_text(s.replace(marker,mutation+marker))
          PY
          set +e
          bun test --isolate ./tests/claude-integration/claude-desktop-remote-hub.test.ts --test-name-pattern 'stored profile=true' 2>&1 | tee mutant.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          grep -F 'toEqual' mutant.log
          grep -F 'claude-opus-4-8-20260911' mutant.log
          if grep -F 'Remote Desktop apply deadline' mutant.log; then exit 1; fi
