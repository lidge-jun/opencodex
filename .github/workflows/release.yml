name: Release

# Publish opencodex to npm — jawcode-style: triggered from the Actions tab with an explicit
# version, dist-tag, and a dry-run-first default. Bump package.json on main BEFORE dispatching
# (or use `bun run release <version>`, which does the bump+commit+push+dispatch for you); the
# workflow verifies the version matches before publishing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish — must equal package.json (e.g. 0.1.0)"
        required: true
        type: string
      tag:
        description: "npm dist-tag"
        required: true
        type: choice
        options:
          - latest
          - preview
        default: latest
      dry-run:
        description: "Dry run (build + pack, no actual publish)"
        required: false
        type: boolean
        default: true
      expected-sha:
        description: "Immutable release commit this dispatch must publish (fail if the branch moved)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted dispatch guard
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted-dispatch

      - name: Validate release dispatch
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          node - <<'NODE'
          const { validateReleaseDispatch } = require(
            "./trusted-dispatch/.github/scripts/release-dispatch-guard.cjs",
          );

          const failure = validateReleaseDispatch({
            eventName: process.env.GITHUB_EVENT_NAME,
            ref: process.env.GITHUB_REF,
            expectedSha: process.env.EXPECTED_SHA,
            actualSha: process.env.GITHUB_SHA,
          });

          if (failure) {
            console.error(`::error::${failure}`);
            process.exit(1);
          }
          NODE
  package-standalone:
    needs: validate-dispatch
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            smoke: true
          - os: macos-latest
            target: bun-darwin-arm64
            smoke: true
          - os: macos-latest
            target: bun-darwin-x64
            smoke: false
          - os: windows-latest
            target: bun-windows-x64
            smoke: true
          - os: ubuntu-latest
            target: bun-linux-arm64
            smoke: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dashboard
        run: bun run build:gui

      - name: Build standalone binary
        run: bun run build:standalone --target ${{ matrix.target }}

      - name: Smoke test standalone binary
        if: matrix.smoke && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          binary="dist/standalone/${{ matrix.target }}/ocx"
          "$binary" --version
          OPENCODEX_HOME="$RUNNER_TEMP/ocx-home" "$binary" start --port 10177 >"$RUNNER_TEMP/ocx.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:10177/healthz && break || sleep 1; done
          curl -fsS http://127.0.0.1:10177/healthz
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:10177/)" = 200

      - name: Smoke test standalone binary (Windows)
        if: matrix.smoke && runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "dist/standalone/${{ matrix.target }}/ocx.exe"
          & $binary --version
          $env:OPENCODEX_HOME = Join-Path $env:RUNNER_TEMP "ocx-home"
          $process = Start-Process -FilePath $binary -ArgumentList "start", "--port", "10177" -PassThru
          try {
            for ($i = 0; $i -lt 30; $i++) {
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:10177/healthz | Out-Null; break } catch { Start-Sleep -Seconds 1 }
            }
            Invoke-WebRequest -UseBasicParsing http://127.0.0.1:10177/healthz | Select-Object -ExpandProperty Content
            Invoke-WebRequest -UseBasicParsing http://127.0.0.1:10177/ | Out-Null
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }

      - name: Archive standalone release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          STANDALONE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cd "dist/standalone/$STANDALONE_TARGET"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell -NoProfile -Command 'Compress-Archive -Path ocx.exe,gui -DestinationPath ("../../ocx-{0}-{1}.zip" -f $env:RELEASE_VERSION,$env:STANDALONE_TARGET) -Force'
          else
            tar -czf "../../ocx-${RELEASE_VERSION}-${STANDALONE_TARGET}.tar.gz" ocx gui
          fi
          cd ../..
          # shasum -c in attach-release runs from dist/release, where the artifact download
          # lands these files flat; the checksum therefore records the bare file name, which
          # sha256sum takes verbatim from its argument.
          if [[ "$RUNNER_OS" == "Windows" ]]; then sha256sum "ocx-${RELEASE_VERSION}-${STANDALONE_TARGET}.zip" > "ocx-${RELEASE_VERSION}-${STANDALONE_TARGET}.sha256"
          else sha256sum "ocx-${RELEASE_VERSION}-${STANDALONE_TARGET}.tar.gz" > "ocx-${RELEASE_VERSION}-${STANDALONE_TARGET}.sha256"
          fi

      - name: Upload standalone release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-${{ matrix.target }}
          path: |
            dist/ocx-*.tar.gz
            dist/ocx-*.zip
            dist/ocx-*.sha256
          if-no-files-found: error
          retention-days: 7

  package-desktop:
    needs: validate-dispatch
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
            sidecar-targets: macos
            artifact-suffixes: macos.dmg,macos.app.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
            sidecar-targets: x86_64-pc-windows-msvc
            artifact-suffixes: windows-x64.msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            sidecar-targets: x86_64-unknown-linux-gnu
            artifact-suffixes: linux-x86_64.AppImage,linux-amd64.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Whether this run holds the Developer ID material at all. A run without it still builds
      # locally useful bundles; a run with it must not silently downgrade any part of the app.
      DESKTOP_SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Build dashboard
        run: bun run build:gui

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Prepare macOS sidecars
        if: runner.os == 'macOS'
        run: |
          bun desktop/scripts/prepare-sidecar.ts --target aarch64-apple-darwin
          bun desktop/scripts/prepare-sidecar.ts --target x86_64-apple-darwin

      - name: Prepare sidecar
        if: runner.os != 'macOS'
        run: bun desktop/scripts/prepare-sidecar.ts --target ${{ matrix.sidecar-targets }}

      # The signing certificate has to be in a keychain before the widget is signed, and the
      # Tauri build step creates its own keychain only when it runs — which is after this. Until
      # this step existed, build-widget.sh saw no MACOS_SIGN_IDENTITY and took its unsigned
      # branch, and the bundler does not re-sign anything under PlugIns, so the extension would
      # have gone out ad-hoc inside a Developer ID host. No release has published a macOS
      # application yet, so this is a defect that had not reached anyone rather than one that had.
      - name: Import the release signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          # Checked as a set, because a partial set is the dangerous case: the Tauri CLI skips
          # notarization without failing when the notary credentials are missing, and the
          # unnotarized artifact is uploaded and attached exactly as a good one would be.
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            if [ "${DRY_RUN}" != "true" ]; then
              echo "::error::A real release needs the full signing and notarization credential set."
              echo "::error::Missing:$missing"
              exit 1
            fi
            echo "Signing credentials are incomplete, so this build stays ad-hoc signed:$missing"
            echo "It is usable for local validation and is not a release asset."
            exit 0
          fi
          keychain="$RUNNER_TEMP/opencodex-signing.keychain-db"
          # Recorded before anything is created, so the cleanup step can still find a keychain
          # that a failure left half-built.
          echo "OPENCODEX_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          keychain_password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          certificate="$RUNNER_TEMP/opencodex-signing.p12"
          # The decoded certificate must not outlive this step even when a later command fails.
          trap 'shred -u "$certificate" 2>/dev/null || rm -Pf "$certificate" 2>/dev/null || true' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          # shellcheck disable=SC2046 # the keychain list is intentionally word-split into arguments
          security list-keychain -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Build WidgetKit extension
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # A run holding Developer ID material must not produce an ad-hoc widget. Without this
          # the script's ad-hoc branch is the silent default, which is how a signed, notarized
          # app shipped with an extension macOS will not register.
          WIDGET_SIGN_REQUIRED: ${{ env.DESKTOP_SIGNING_CONFIGURED == 'true' && '1' || '0' }}
        run: bash desktop/scripts/build-widget.sh

      - name: Verify the extension carries the release signature
        if: runner.os == 'macOS'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          appex=desktop/src-tauri/widget/OpenCodexWidget.appex
          if [ -z "${APPLE_TEAM_ID}" ]; then
            if [ "${DRY_RUN}" != "true" ]; then
              echo "::error::A real release cannot assert its own signature without APPLE_TEAM_ID."
              exit 1
            fi
            echo "No team configured; skipping the signature assertion for this non-release build."
            exit 0
          fi
          codesign --verify --strict --deep "$appex"
          description="$(codesign -dvvv "$appex" 2>&1)"
          echo "$description"
          echo "$description" | grep -q "TeamIdentifier=$APPLE_TEAM_ID"
          echo "$description" | grep -q "flags=.*runtime"
          echo "$description" | grep -q "Timestamp="

      # Release signing is intentionally secret-gated. Developer ID, notarization,
      # and updater signatures require maintainer-owned credentials; builds without
      # those secrets remain useful for local validation but are not release assets.
      - name: Build desktop bundles
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bunx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Rename release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DESKTOP_TARGET: ${{ matrix.target }}
        run: |
          bun desktop/scripts/collect-release-assets.ts \
            --version "$RELEASE_VERSION" \
            --target "$DESKTOP_TARGET" \
            --out dist/release

      # After the bundle exists, not before: a sweep that runs first passes by finding nothing.
      - name: Verify every Mach-O in the bundle carries the release identity
        if: runner.os == 'macOS'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_TEAM_ID}" ]; then
            if [ "${DRY_RUN}" != "true" ]; then
              echo "::error::A real release cannot verify its bundle without APPLE_TEAM_ID."
              exit 1
            fi
            echo "No team configured; skipping the bundle-wide assertion for this local build."
            exit 0
          fi
          # Executables are found by their magic bytes rather than by path or extension. A bundler
          # signs what it placed; anything copied in afterwards is invisible to it, and the
          # binaries that get missed are the ones with no extension to filter on.
          apps=0
          machos=0
          bad=0
          while IFS= read -r app; do
            apps=$((apps + 1))
            echo "checking $app"
            while IFS= read -r -d '' file; do
              # All eight Mach-O leading words: thin and fat, 32- and 64-bit, both byte orders.
              # A list that covers only the common ones skips the rest in silence while the
              # non-zero counter below still reports a healthy sweep.
              case "$(head -c 4 "$file" | xxd -p)" in
                cefaedfe|cffaedfe|feedface|feedfacf) ;;
                cafebabe|bebafeca|cafebabf|bfbafeca) ;;
                *) continue ;;
              esac
              machos=$((machos + 1))
              if ! codesign -dvvv "$file" 2>&1 | grep -q "TeamIdentifier=$APPLE_TEAM_ID"; then
                echo "::error::$file is not signed with the release identity"
                bad=1
              fi
            done < <(find "$app" -type f -print0)
          done < <(find desktop/src-tauri/target -maxdepth 6 -type d -name '*.app')
          echo "inspected $machos Mach-O files across $apps app bundles"
          # A sweep that inspected nothing is the failure mode this step exists to prevent.
          if [ "$apps" -eq 0 ] || [ "$machos" -eq 0 ]; then
            echo "::error::found $apps app bundles and $machos Mach-O files; the sweep inspected nothing"
            exit 1
          fi
          exit "$bad"

      - name: Upload desktop release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.target }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

      # always(), because a keychain holding the release identity must not survive a failed job
      # on a runner image that could be reused.
      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${OPENCODEX_SIGNING_KEYCHAIN:-}" ] && [ -f "${OPENCODEX_SIGNING_KEYCHAIN}" ]; then
            security delete-keychain "${OPENCODEX_SIGNING_KEYCHAIN}"
          fi

  attach-release:
    runs-on: ubuntu-latest
    needs: [publish, package-standalone, package-desktop]
    if: ${{ inputs.dry-run != true }}
    env:
      UPDATER_SIGNING_CONFIGURED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Download standalone packaged assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: standalone-*
          merge-multiple: true
          path: dist/release

      - name: Download desktop packaged assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist/release

      # Generate latest.json only when the updater key is configured; then require
      # signatures for all four updater platforms before publishing it.
      - name: Generate updater manifest
        if: env.UPDATER_SIGNING_CONFIGURED == 'true'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          bun desktop/scripts/updater-manifest.ts \
            --version "$RELEASE_VERSION" \
            --dir dist/release \
            --repo lidge-jun/opencodex \
            --out dist/release/latest.json \
            --require-all

      - name: Verify the checksum before uploading
        run: |
          cd dist/release
          shasum -a 256 -c ./*.sha256

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Workflow inputs reach shell code through env, never by interpolation into
          # run: source. tests/ci-workflows.test.ts enforces this repo-wide.
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release upload "v${RELEASE_VERSION}" dist/release/* --clobber

  publish:
    needs: [validate-dispatch, package-standalone, package-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Verify dispatched SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          if [ -z "$EXPECTED_SHA" ]; then
            echo "::error::expected-sha is required; refusing to publish without an audited commit"
            exit 1
          elif [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::branch moved after the release audit (expected ${EXPECTED_SHA}, got ${GITHUB_SHA}) — refusing to publish an unaudited commit"
            exit 1
          fi

      # opencodex is bun-native (the prepublishOnly audit, GUI build, and typecheck run under bun).
      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      # node + npm perform the actual publish. registry-url points npm at the public registry.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (OIDC) needs npm >= 11.5.1. Node 24 runners already
      # provide a compatible npm; avoid replacing the bundled npm because global
      # npm self-updates can lose publish-time dependencies such as sigstore.
      - name: Verify npm version
        run: |
          npm_version="$(npm --version)"
          echo "npm=${npm_version}"
          # shellcheck disable=SC2016 # the node script deliberately avoids shell expansion
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5)) {
              console.error(`npm ${process.argv[1]} is too old for trusted publishing; need >= 11.5.1`);
              process.exit(1);
            }
          ' "$npm_version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit (high severity)
        run: bun run audit:high

      - name: Verify version matches package.json
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          echo "package.json=$PKG  input=${RELEASE_VERSION}"
          test "$PKG" = "$RELEASE_VERSION" || {
            echo "::error::package.json ($PKG) != requested (${RELEASE_VERSION}) — bump package.json on main first";
            exit 1;
          }

      # The exact-SHA CI gate includes the hosted Linux, Windows, and macOS
      # keyring smoke matrix. Do not duplicate its Linux bootstrap here.
      - name: Require successful Cross-platform CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          NPM_DIST_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          case "$GITHUB_REF" in
            refs/heads/main)
              expected_tag="latest"
              if [[ "$RELEASE_VERSION" == *-* ]]; then
                echo "::error::main releases must use a stable semver version; got ${RELEASE_VERSION}"
                exit 1
              fi
              ;;
            refs/heads/preview)
              expected_tag="preview"
              if [[ "$RELEASE_VERSION" != *-preview.* ]]; then
                echo "::error::preview releases must use a preview prerelease version; got ${RELEASE_VERSION}"
                exit 1
              fi
              ;;
            *)
              echo "::error::Release must run from main or preview; got ${GITHUB_REF}"
              exit 1
              ;;
          esac

          if [ "$NPM_DIST_TAG" != "$expected_tag" ]; then
            echo "::error::${GITHUB_REF#refs/heads/} releases must publish with npm dist-tag '${expected_tag}', got '${NPM_DIST_TAG}'"
            exit 1
          fi

          ci_url="$(
            gh run list \
              --workflow ci.yml \
              --branch "${GITHUB_REF#refs/heads/}" \
              --commit "$GITHUB_SHA" \
              --event push \
              --limit 10 \
              --json conclusion,url \
              --jq '[.[] | select(.conclusion == "success")][0].url // ""'
          )"

          if [ -z "$ci_url" ]; then
            # Deliberately narrower than "any successful ci.yml run for this SHA".
            # The release branch's own push run is the one whose trigger set,
            # runner selection, and job graph match what is being published —
            # a green PR run for the same SHA ran against a merge ref with a
            # different trigger context. Accepting it here would let a publish
            # proceed while the promotion run was still pending, or had failed.
            echo "::error::No successful Cross-platform CI run found for ${GITHUB_SHA} on ${GITHUB_REF#refs/heads/} (push event). A pull-request run does not qualify. Wait for the promotion run to pass before releasing."
            gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 10 || true
            exit 1
          fi

          echo "Cross-platform CI passed for ${GITHUB_SHA}: ${ci_url}"

          # Service baseline (lineage-relative): merged tags only, so the
          # changed-files gate compares against the last release actually
          # reachable from this commit. The release-notes baseline below uses the
          # full tag set instead, so a stable on another lineage can anchor the
          # changelog range.
          # - Preview: newest prior release of either channel (stable or preview). A
          #   preview→preview-only baseline skips a shipped stable and restates it.
          # - Stable: newest prior stable only (matching preview carry adjusts the
          #   generate-notes range separately below).
          previous_tag="$(
            git tag --merged HEAD --list 'v[0-9]*' |
              bun scripts/release-notes.ts previous-release-tag "$RELEASE_VERSION"
          )"
          if [ -n "$previous_tag" ]; then
            changed_files="$(git diff --name-only "${previous_tag}..HEAD")"
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          fi

          # Keep in sync with the service-lifecycle.yml trigger paths. src/cli.ts is
          # the pre-restructure compat stub that durable launchers still execute; the
          # service implementation itself is the src/service/ directory, and the desktop
          # shell packages and launches it.
          if printf '%s\n' "$changed_files" | grep -Eq '^(src/service\.ts|src/service/.*|desktop/.*|src/cli\.ts|src/cli/index\.ts|src/lib/bun-runtime\.ts|package\.json|bun\.lock|\.github/workflows/service-lifecycle\.yml|\.github/workflows/release\.yml)$'; then
            service_url="$(
              gh run list \
                --workflow service-lifecycle.yml \
                --commit "$GITHUB_SHA" \
                --limit 10 \
                --json conclusion,headSha,url,workflowName \
                --jq '[.[] | select(.conclusion == "success")][0].url // ""'
            )"
            if [ -z "$service_url" ]; then
              echo "::error::Service-related files changed since ${previous_tag:-initial commit}, but no successful Service lifecycle run was found for ${GITHUB_SHA}."
              gh run list --workflow service-lifecycle.yml --commit "$GITHUB_SHA" --limit 10 || true
              exit 1
            fi
            echo "Service lifecycle passed for ${GITHUB_SHA}: ${service_url}"
          fi

      - name: Require dev to be ready for this release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin +refs/heads/dev:refs/remotes/origin/dev
          dev_version="$(git show origin/dev:package.json | bun -e 'console.log(JSON.parse(await Bun.stdin.text()).version)')"
          bun scripts/version-line.ts assert-ahead "$dev_version" "$RELEASE_VERSION"

      # Tokenless publish via Trusted Publishing (OIDC) — NO NPM_TOKEN secret. npm auto-detects the
      # OIDC environment (`id-token: write` above) and generates provenance automatically, so neither a
      # token nor `--provenance` is needed. `npm publish` runs prepublishOnly first (typecheck + build
      # the GUI into gui/dist), so even a dry-run fully verifies the build.
      # PREREQUISITE: configure the Trusted Publisher for this repo + workflow on npmjs.com — possible
      # only AFTER the package's first version exists (do the first publish locally, see the runbook).
      - name: Preflight release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          pkg_name="$(node -p "require('./package.json').name")"
          release_tag="v${RELEASE_VERSION}"
          dry_run="$DRY_RUN"

          git fetch --force --tags origin

          existing_tag_sha="$(git rev-parse -q --verify "refs/tags/${release_tag}^{commit}" || true)"
          if [ -n "$existing_tag_sha" ] && [ "$existing_tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::${release_tag} already points at ${existing_tag_sha}, not ${GITHUB_SHA}"
            exit 1
          fi

          if [ -n "$existing_tag_sha" ]; then
            if [ "$dry_run" = "true" ]; then
              echo "::notice::${release_tag} already exists at this commit; dry-run only"
            else
              echo "::error::${release_tag} already exists. Refusing to publish a version with pre-existing Git metadata."
              exit 1
            fi
          fi

          if gh release view "$release_tag" >/dev/null 2>&1; then
            if [ "$dry_run" = "true" ]; then
              echo "::notice::GitHub Release ${release_tag} already exists; dry-run only"
            else
              echo "::error::GitHub Release ${release_tag} already exists. Choose the next unused patch version."
              exit 1
            fi
          fi

          if npm view "${pkg_name}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            if [ "$dry_run" = "true" ]; then
              echo "::notice::${pkg_name}@${RELEASE_VERSION} already exists on npm; dry-run only"
            else
              echo "::error::${pkg_name}@${RELEASE_VERSION} already exists on npm. Choose the next unused patch version."
              exit 1
            fi
          fi

      - name: Refuse a release the current tag set already outranks
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          allow=""
          existing_tag_sha="$(git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}^{commit}" || true)"
          if [ "$DRY_RUN" = "true" ] && [ -n "$existing_tag_sha" ] && [ "$existing_tag_sha" = "$GITHUB_SHA" ]; then
            allow="--allow-existing-tag-at-head"
          fi
          git tag --list 'v*' | bun scripts/version-line.ts assert-releasable "$RELEASE_VERSION" $allow

      - name: Build and validate release changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          NPM_DIST_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          notes_file="$GITHUB_WORKSPACE/.release-notes.md"
          bun scripts/build-release-changelog.ts \
            --version "$RELEASE_VERSION" \
            --dist-tag "$NPM_DIST_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --out "$notes_file"
          test -s "$notes_file" || {
            echo "::error::release changelog builder produced an empty notes file"
            exit 1
          }

      - name: Publish (or dry-run)
        id: publication
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          NPM_DIST_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::DRY RUN — building + packing, not publishing"
            npm run prepublishOnly
            npm pack --dry-run
          else
            npm publish --tag "$NPM_DIST_TAG" --access public
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # Publication is acknowledged before registry reads, which can lag or fail.
      # Recover only observation failures in this run; never retry npm publish.
      - name: Post-publish registry smoke
        id: registry-smoke
        if: ${{ inputs.dry-run != true && steps.publication.outputs.published == 'true' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PUBLISHED: ${{ steps.publication.outputs.published }}
        run: |
          set -euo pipefail
          test "$PUBLISHED" = "true" || {
            echo "::error::No successful publication receipt; refusing registry recovery"
            exit 1
          }
          pkg_name="$(node -p "require('./package.json').name")"
          for attempt in $(seq 1 6); do
            if VERSION=$(timeout --kill-after=2s 10s npm view "${pkg_name}@${RELEASE_VERSION}" version --fetch-retries=0 --fetch-timeout=8000 2>/dev/null); then
              if [ "$VERSION" != "$RELEASE_VERSION" ]; then
                echo "::error::Registry returned an unexpected version; refusing to create a release"
                exit 1
              fi
              echo "registry version=$VERSION"
              echo "verification=verified" >> "$GITHUB_OUTPUT"
              echo "Registry verified ${pkg_name}@${RELEASE_VERSION}." >> "$GITHUB_STEP_SUMMARY"
              timeout --kill-after=2s 10s npm dist-tag ls "$pkg_name" --fetch-retries=0 --fetch-timeout=8000 || echo "::warning::Could not read npm dist-tags; exact version was verified"
              exit 0
            fi
            echo "::notice::Registry lookup not confirmed (attempt $attempt/6)"
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
          done
          echo "verification=pending" >> "$GITHUB_OUTPUT"
          echo "::warning::npm publish succeeded, but registry verification remains pending; continuing GitHub release creation without republishing"
          echo "Publication acknowledged for ${pkg_name}@${RELEASE_VERSION}; registry verification pending after bounded reads. Inspect the registry before announcing availability. Do not republish this version." >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        if: ${{ inputs.dry-run != true && steps.publication.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          release_tag="v${RELEASE_VERSION}"
          notes_file="$GITHUB_WORKSPACE/.release-notes.md"
          test -s "$notes_file" || {
            echo "::error::validated release notes are missing; refusing to tag or create a release"
            exit 1
          }

          git fetch --force --tags origin

          existing_tag_sha="$(git rev-parse -q --verify "refs/tags/${release_tag}^{commit}" || true)"
          if [ -n "$existing_tag_sha" ] && [ "$existing_tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::${release_tag} already points at ${existing_tag_sha}, not ${GITHUB_SHA}"
            exit 1
          fi

          prerelease_flag=""
          if [[ "$RELEASE_VERSION" == *-preview.* ]]; then
            prerelease_flag="--prerelease"
          fi

          if [ -z "$existing_tag_sha" ]; then
            git tag "$release_tag" "$GITHUB_SHA"
            git push origin "refs/tags/${release_tag}"
          fi

          gh release create "$release_tag" --target "$GITHUB_SHA" --title "$release_tag" \
            --notes-file "$notes_file" ${prerelease_flag:+$prerelease_flag}
