name: CL09 status doc fix

on:
  push:
    branches:
      - feat/cl-09-passive-production-evidence
    paths:
      - .github/workflows/cl09-status-doc-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cl-09-passive-production-evidence
      - name: Update CL-09 implementation status wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('devlog/_plan/260807_compatibility_lab/009_cl09_passive_production_evidence.md')
          s = p.read_text()
          s = s.replace(
            'This initial CL-09 PR is contract-only. Implementation is not authorized until the contract is reviewed.',
            'The CL-09 contract was frozen first on this branch. Runtime implementation now proceeds under this contract and remains subject to independent final review before merge.',
            1,
          )
          s = s.replace(
            '## CL-09.0 - Audit and contract\n\nThis PR:',
            '## CL-09.0 - Audit and contract\n\nCompleted first on this PR:',
            1,
          )
          p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/cl09-status-doc-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add devlog/_plan/260807_compatibility_lab/009_cl09_passive_production_evidence.md
          git commit -m "docs(lab): reflect CL-09 implementation phase"
          git push origin HEAD:feat/cl-09-passive-production-evidence
