name: CL-09 translation dedupe

on:
  push:
    branches:
      - feat/cl-09-passive-production-evidence

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Remove duplicate Lab production translations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("gui/src/i18n/lab-translations.ts")
          text = path.read_text(encoding="utf-8")
          old_type = 'export type LabCatalogKey = Extract<TKey, `lab.${string}`>;'
          new_type = 'export type LabCatalogKey = Exclude<Extract<TKey, `lab.${string}`>, `lab.production.${string}`>;'

          if old_type not in text:
              raise SystemExit("LabCatalogKey declaration changed; refusing broad edit")

          lines = text.splitlines(keepends=True)
          duplicate_lines = [line for line in lines if '"lab.production.' in line]
          if len(duplicate_lines) != 48:
              raise SystemExit(f"expected 48 duplicate translation lines, found {len(duplicate_lines)}")

          text = "".join(line for line in lines if '"lab.production.' not in line)
          text = text.replace(old_type, new_type, 1)

          if any('"lab.production.' in line for line in text.splitlines()):
              raise SystemExit("duplicate lab.production translation entry remains")
          if "export type LabSupplementKey =" not in text:
              raise SystemExit("LabSupplementKey was unexpectedly removed")
          if "export function labSupplement(" not in text:
              raise SystemExit("labSupplement was unexpectedly removed")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile

      - name: Validate focused i18n change
        shell: bash
        run: |
          bun x tsc --noEmit
          cd gui
          bun test tests/compatibility-lab-i18n.test.ts tests/locale-parity.test.ts
          bun run lint

      - name: Commit focused fix and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui/src/i18n/lab-translations.ts
          git rm .github/workflows/cl09-dedupe-lab-translations.yml
          git diff --cached --check
          git commit -m "fix(gui): deduplicate passive evidence translations"
          git push origin HEAD:${GITHUB_REF_NAME}
