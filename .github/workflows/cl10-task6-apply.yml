name: CL-10 Task 6 patch

on:
  push:
    branches:
      - feat/cl-10-public-evidence-runtime

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'chore: apply CL-10 Task 6')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply operator surfaces
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          cli = Path('src/cli/lab.ts')
          s = cli.read_text()
          needle = 'import { createProductionLabRouteExecutor } from "../lib/lab-live-route-production";\n'
          insert = needle + '''import {\n  exportLocalPublicEvidence,\n  importCommunityEvidenceFile,\n  listCommunityEvidenceContext,\n  previewLocalPublicEvidence,\n  verifyPublicEvidenceFile,\n  type PublicVerificationSummaryV1,\n} from "../lab/public";\n'''
          assert needle in s
          s = s.replace(needle, insert, 1)

          usage_needle = '  ocx lab catalog [--layer <layer>] [--suite <id>] [--json]\n'
          usage_insert = usage_needle + '''  ocx lab public preview --event <eventId> [--event <eventId> ...] [--json]\n  ocx lab public export --event <eventId> [--event <eventId> ...] [--json]\n  ocx lab public verify --file <bundle.json> [--json]\n  ocx lab public import --file <bundle.json> [--json]\n  ocx lab public community [--json]\n'''
          assert usage_needle in s
          s = s.replace(usage_needle, usage_insert, 1)

          handle_needle = 'export async function handleLabCommand(argv: string[], deps: LabCliDeps = {}): Promise<number> {\n'
          helpers = r'''function takeRepeatedOptions(args: string[], flag: string): string[] {
            const values: string[] = [];
            while (true) {
              const index = args.indexOf(flag);
              if (index < 0) break;
              const value = args[index + 1];
              if (!value || value.startsWith("--")) {
                throw new CliUsageError(`${flag} requires a value`, USAGE);
              }
              values.push(value);
              args.splice(index, 2);
            }
            return values;
          }

          function publicPreviewLines(result: ReturnType<typeof previewLocalPublicEvidence>): string[] {
            return [
              `Public evidence preview: ${result.bundle.records.length} exportable record(s)`,
              `Excluded: ${result.excluded.length}`,
              "Unsigned local preview; no publisher key or remote publish is created.",
            ];
          }

          function publicExportLines(result: ReturnType<typeof exportLocalPublicEvidence>): string[] {
            return [
              "Public evidence exported locally",
              `Bundle: ${result.bundle.bundleId}`,
              `Publisher: ${result.bundle.publisher.keyId}`,
              `Path: ${result.stored.path}`,
              `Excluded: ${result.excluded.length}`,
              "No remote publish occurred.",
            ];
          }

          function publicVerificationLines(result: PublicVerificationSummaryV1): string[] {
            if (result.status !== "cryptographically_valid") {
              return [
                `Public evidence verification: ${result.status}`,
                "Not locally verified.",
                ...(result.detail ? [result.detail] : []),
              ];
            }
            return [
              "Public evidence verification: cryptographically valid",
              `Bundle: ${result.bundleId}`,
              `Publisher: ${result.publisherKeyId}`,
              "Not locally verified. Signature validity proves integrity/continuity only.",
            ];
          }

          function handlePublicLabCommand(
            argv: string[],
            wantsJson: boolean,
            configDir: string,
          ): void {
            const [action, ...restInput] = argv;
            const rest = [...restInput];
            switch (action) {
              case "preview": {
                const eventIds = takeRepeatedOptions(rest, "--event");
                rejectArgs(rest, USAGE);
                const result = previewLocalPublicEvidence({ eventIds }, configDir);
                printData(result, wantsJson, publicPreviewLines(result));
                return;
              }
              case "export": {
                const eventIds = takeRepeatedOptions(rest, "--event");
                rejectArgs(rest, USAGE);
                const result = exportLocalPublicEvidence({ eventIds }, configDir);
                printData(result, wantsJson, publicExportLines(result));
                return;
              }
              case "verify": {
                const path = takeOption(rest, "--file");
                if (!path) throw new CliUsageError("public verify requires --file", USAGE);
                rejectArgs(rest, USAGE);
                const result = verifyPublicEvidenceFile(path);
                printData(result, wantsJson, publicVerificationLines(result));
                return;
              }
              case "import": {
                const path = takeOption(rest, "--file");
                if (!path) throw new CliUsageError("public import requires --file", USAGE);
                rejectArgs(rest, USAGE);
                const result = importCommunityEvidenceFile(path, configDir);
                printData(result, wantsJson, [
                  `Community evidence imported: ${result.bundleId}`,
                  `Publisher: ${result.publisherKeyId}`,
                  "Trust: community_untrusted_v1; not locally verified.",
                ]);
                return;
              }
              case "community": {
                rejectArgs(rest, USAGE);
                const result = listCommunityEvidenceContext(configDir);
                const lines = result.evidence.length > 0
                  ? result.evidence.map((row) =>
                    `${row.bundleId} publisher=${row.publisherKeyId} active=${row.activeRecordCount} revoked=${row.revokedRecordCount}`,
                  )
                  : ["No community evidence"];
                printData(result, wantsJson, [
                  "Community evidence (untrusted, read-only context; not locally verified)",
                  ...lines,
                ]);
                return;
              }
              default:
                throw new CliUsageError("unknown public subcommand", USAGE);
            }
          }

          '''
          assert handle_needle in s
          s = s.replace(handle_needle, helpers + handle_needle, 1)

          switch_needle = '      switch (sub) {\n'
          switch_insert = '''      switch (sub) {\n        case "public": {\n          handlePublicLabCommand(rest, wantsJson, configDir);\n          return;\n        }\n'''
          assert switch_needle in s
          s = s.replace(switch_needle, switch_insert, 1)
          cli.write_text(s)

          routes = Path('src/server/management/lab-routes.ts')
          s = routes.read_text()
          import_needle = 'import { jsonResponse } from "../auth-cors";\n'
          import_insert = '''import {\n  exportLocalPublicEvidence,\n  importCommunityEvidenceValue,\n  listCommunityEvidenceContext,\n  previewLocalPublicEvidence,\n  summarizePublicEvidenceVerification,\n  PublicEvidenceValidationError,\n} from "../../lab/public";\n''' + import_needle
          assert import_needle in s
          s = s.replace(import_needle, import_insert, 1)

          handler_needle = 'export async function handleLabRoutes(ctx: ManagementContext): Promise<Response | null> {\n'
          handler_helpers = r'''const MAX_PUBLIC_REQUEST_BYTES = 2 * 1024 * 1024;

          async function readBoundedPublicJson(req: Request): Promise<unknown> {
            const lengthRaw = req.headers.get("content-length");
            if (lengthRaw) {
              const length = Number(lengthRaw);
              if (!Number.isFinite(length) || length < 0 || length > MAX_PUBLIC_REQUEST_BYTES) {
                throw new PublicEvidenceValidationError(
                  "public_request_too_large",
                  "public evidence request exceeds 2 MiB",
                );
              }
            }
            if (!req.body) {
              throw new PublicEvidenceValidationError("public_request_body", "JSON body is required");
            }
            const reader = req.body.getReader();
            const chunks: Uint8Array[] = [];
            let total = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              total += value.byteLength;
              if (total > MAX_PUBLIC_REQUEST_BYTES) {
                await reader.cancel();
                throw new PublicEvidenceValidationError(
                  "public_request_too_large",
                  "public evidence request exceeds 2 MiB",
                );
              }
              chunks.push(value);
            }
            const bytes = new Uint8Array(total);
            let offset = 0;
            for (const chunk of chunks) {
              bytes.set(chunk, offset);
              offset += chunk.byteLength;
            }
            try {
              return JSON.parse(new TextDecoder().decode(bytes));
            } catch {
              throw new PublicEvidenceValidationError("public_request_json", "request body is not valid JSON");
            }
          }

          function publicEventIds(raw: unknown): string[] {
            if (!raw || typeof raw !== "object" || Array.isArray(raw)) {
              throw new PublicEvidenceValidationError("public_request_body", "request body must be an object");
            }
            const keys = Object.keys(raw);
            if (keys.length !== 1 || keys[0] !== "eventIds") {
              throw new PublicEvidenceValidationError("public_request_body", "only eventIds is accepted");
            }
            const eventIds = (raw as { eventIds?: unknown }).eventIds;
            if (!Array.isArray(eventIds) || !eventIds.every((value) => typeof value === "string")) {
              throw new PublicEvidenceValidationError("public_request_body", "eventIds must be a string array");
            }
            return eventIds as string[];
          }

          function publicBundleValue(raw: unknown): unknown {
            if (!raw || typeof raw !== "object" || Array.isArray(raw)) {
              throw new PublicEvidenceValidationError("public_request_body", "request body must be an object");
            }
            const keys = Object.keys(raw);
            if (keys.length !== 1 || keys[0] !== "bundle") {
              throw new PublicEvidenceValidationError("public_request_body", "only bundle is accepted");
            }
            return (raw as { bundle?: unknown }).bundle;
          }

          function publicErrorResponse(err: unknown, ctx: ManagementContext): Response {
            const message = err instanceof Error ? err.message : "public evidence operation failed";
            const code = err instanceof PublicEvidenceValidationError
              ? err.code
              : "public_evidence_error";
            return errorResponse(code, message, 400, ctx);
          }

          '''
          assert handler_needle in s
          s = s.replace(handler_needle, handler_helpers + handler_needle, 1)

          method_needle = '''  if (!url.pathname.startsWith("/api/lab")) return null;\n  if (req.method !== "GET") return null;\n\n  if (url.pathname === "/api/lab/status") {\n'''
          method_insert = '''  if (!url.pathname.startsWith("/api/lab")) return null;\n\n  if (req.method === "GET" && url.pathname === "/api/lab/public/community") {\n    try {\n      return jsonResponse(listCommunityEvidenceContext(), 200, req, config);\n    } catch (err) {\n      return publicErrorResponse(err, ctx);\n    }\n  }\n\n  if (req.method === "POST") {\n    if (url.pathname === "/api/lab/public/preview") {\n      try {\n        const body = await readBoundedPublicJson(req);\n        return jsonResponse(\n          previewLocalPublicEvidence({ eventIds: publicEventIds(body) }),\n          200,\n          req,\n          config,\n        );\n      } catch (err) {\n        return publicErrorResponse(err, ctx);\n      }\n    }\n    if (url.pathname === "/api/lab/public/export") {\n      try {\n        const body = await readBoundedPublicJson(req);\n        return jsonResponse(\n          exportLocalPublicEvidence({ eventIds: publicEventIds(body) }),\n          200,\n          req,\n          config,\n        );\n      } catch (err) {\n        return publicErrorResponse(err, ctx);\n      }\n    }\n    if (url.pathname === "/api/lab/public/verify") {\n      try {\n        const body = await readBoundedPublicJson(req);\n        const result = summarizePublicEvidenceVerification(publicBundleValue(body));\n        return jsonResponse(\n          result,\n          result.status === "cryptographically_valid" ? 200 : 400,\n          req,\n          config,\n        );\n      } catch (err) {\n        return publicErrorResponse(err, ctx);\n      }\n    }\n    if (url.pathname === "/api/lab/public/community/import") {\n      try {\n        const body = await readBoundedPublicJson(req);\n        return jsonResponse(\n          importCommunityEvidenceValue(publicBundleValue(body)),\n          200,\n          req,\n          config,\n        );\n      } catch (err) {\n        return publicErrorResponse(err, ctx);\n      }\n    }\n    return null;\n  }\n\n  if (req.method !== "GET") return null;\n\n  if (url.pathname === "/api/lab/status") {\n'''
          assert method_needle in s
          s = s.replace(method_needle, method_insert, 1)
          routes.write_text(s)

          test = Path('tests/lab-public-surfaces.test.ts')
          s = test.read_text()
          old = '''  test("does not expose a remote publish endpoint", async () => {\n    const home = tempHome();\n    const res = await api(home, "/api/lab/public/publish", { method: "POST", body: {} });\n    expect(res.status).toBe(404);\n  });'''
          new = '''  test("does not expose a remote publish endpoint", async () => {\n    const home = tempHome();\n    process.env.OPENCODEX_HOME = home;\n    const req = new ManagementRequest("http://127.0.0.1/api/lab/public/publish", {\n      method: "POST",\n      headers: { "content-type": "application/json" },\n      body: "{}",\n    });\n    const res = await handleManagementAPI(req, new URL(req.url), config(home), {\n      refreshCodexCatalog: async () => {},\n    });\n    expect(res).toBeNull();\n  });'''
          assert old in s
          s = s.replace(old, new, 1)
          test.write_text(s)
          PY
      - run: bun install --frozen-lockfile
      - run: bun test tests/lab-public-evidence.test.ts tests/lab-public-evidence-signature.test.ts tests/lab-community-evidence.test.ts tests/lab-community-publisher-continuity.test.ts tests/lab-public-surfaces.test.ts
      - run: bun x tsc --noEmit
      - name: Commit validated Task 6 patch
        shell: bash
        run: |
          rm .github/workflows/cl10-task6-apply.yml
          git config user.name Wibias
          git config user.email 37517432+Wibias@users.noreply.github.com
          git add src/cli/lab.ts src/server/management/lab-routes.ts tests/lab-public-surfaces.test.ts .github/workflows/cl10-task6-apply.yml
          git commit -m "feat(lab): add CL-10 local public evidence surfaces"
          git push origin HEAD:feat/cl-10-public-evidence-runtime
