name: Temporary CodeQL repair verification

on:
  push:
    branches:
      - agent/codeql-real-findings-20260815

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply remaining validated CodeQL fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = [
              (
                  Path("src/codex/inject.ts"),
                  r'"(?:\\.|[^"])*"',
                  r'"(?:\\.|[^"\\])*"',
                  3,
              ),
              (
                  Path(".github/scripts/issue-quality-core.cjs"),
                  r'/<!--[\s\S]*?-->/g',
                  r'/<!--[\s\S]*?(?:-->|$)/g',
                  3,
              ),
          ]

          for path, old, new, expected in replacements:
              text = path.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} vulnerable matches, found {actual}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          unsafe = r'"(?:\\.|[^"])*"'
          safe = r'"(?:\\.|[^"\\])*"'
          for name in (
              "src/codex/project-config-warnings.ts",
              "src/codex/inject.ts",
              "src/codex/plugins-doctor.ts",
          ):
              text = Path(name).read_text(encoding="utf-8")
              if unsafe in text:
                  raise SystemExit(f"{name}: unsafe TOML matcher remains")
              if safe not in text:
                  raise SystemExit(f"{name}: safe TOML matcher missing")

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused regressions
        run: >-
          bun test
          tests/codeql-real-findings-regressions.test.ts
          tests/project-config-warnings.test.ts
          tests/codex-inject.test.ts
          tests/codex-plugins-doctor.test.ts
          .github/scripts/pr-quality.test.cjs

      - name: Typecheck
        run: bun run typecheck

      - name: Check diff
        run: git diff --check

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex/inject.ts .github/scripts/issue-quality-core.cjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: close validated CodeQL findings [codeql-patch-applied]"
          git push origin HEAD:agent/codeql-real-findings-20260815
