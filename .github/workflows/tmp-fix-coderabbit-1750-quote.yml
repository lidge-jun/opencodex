name: Temporary PR 1750 quote fix

on:
  push:
    branches:
      - agent/codeql-real-findings-20260815

concurrency:
  group: tmp-fix-coderabbit-1750-quote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-verify:
    name: Fix and verify malformed quote handling
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply fix and regression
        shell: python
        run: |
          from pathlib import Path
          source = Path("src/codex/plugins-doctor.ts")
          text = source.read_text(encoding="utf-8")
          old = r'''|[^\s#]+)\s*(?:#.*)?$/);'''
          new = r'''|(?!["'])[^\s#]+)\s*(?:#.*)?$/);'''
          if text.count(old) != 1:
              raise SystemExit(f"source anchor count was {text.count(old)}")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/codex-plugins-doctor.test.ts")
          text = tests.read_text(encoding="utf-8")
          anchor = '  test("parses a table header with a trailing inline comment", () => {'
          regression = '  test("unterminated quoted values are rejected instead of parsed as bare values", () => {\n    const { dir, configPath } = makeConfig(\n      `[marketplaces.openai-bundled]\\nsource_type = "local"\\nsource = "unterminated\\n`,\n    );\n    try {\n      const result = diagnoseCodexBundledPlugins({\n        platform: "win32",\n        configPath,\n        locateCurrent: () => null,\n      });\n      expect(result.applicable).toBe(true);\n      if (result.applicable) {\n        expect(result.marketplace.sourceType).toBe("local");\n        expect(result.marketplace.source).toBeNull();\n        expect(result.stale).toBe(false);\n        expect(result.suggestedRepair).toBeNull();\n      }\n    } finally {\n      rmSync(dir, { recursive: true, force: true });\n    }\n  });\n\n'
          if text.count(anchor) != 1:
              raise SystemExit(f"test anchor count was {text.count(anchor)}")
          tests.write_text(text.replace(anchor, regression + anchor, 1), encoding="utf-8")
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run affected Bun suites
        run: bun test tests/project-config-warnings.test.ts tests/codex-inject.test.ts tests/codex-plugins-doctor.test.ts tests/release-notes.test.ts
      - name: Run quality-gate Node suites
        run: node --test .github/scripts/issue-quality.test.cjs .github/scripts/pr-quality.test.cjs
      - name: Typecheck
        run: bun run typecheck
      - name: Check branch diff
        run: git diff --check origin/dev...HEAD
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-fix-coderabbit-1750-quote.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex/plugins-doctor.ts tests/codex-plugins-doctor.test.ts .github/workflows/tmp-fix-coderabbit-1750-quote.yml
          git commit -m "fix: reject malformed quoted marketplace values"
          git push origin HEAD:agent/codeql-real-findings-20260815
