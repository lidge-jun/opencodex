name: CL09 core patch

on:
  push:
    branches:
      - feat/cl-09-passive-production-evidence
    paths:
      - .github/workflows/cl09-core-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cl-09-passive-production-evidence
      - name: Apply exact CL-09 production-attempt linkage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/server/responses/core.ts')
          s = p.read_text()
          import_anchor = 'import { evidenceFromBody } from "../../routing/request-evidence";\n'
          import_line = 'import { resolveProductionRouteSubject } from "../../routing/compatibility/subject";\n'
          if import_line not in s:
              if import_anchor not in s:
                  raise SystemExit('import anchor missing')
              s = s.replace(import_anchor, import_anchor + import_line, 1)
          seal = '  sealRequestAttemptIdentity(logCtx.activeAttempt, logCtx.provider, adapter.name);\n'
          block = '''  sealRequestAttemptIdentity(logCtx.activeAttempt, logCtx.provider, adapter.name);\n  // CL-09: attach only the opaque exact route-subject identity to the attempt.\n  // This is best-effort passive metadata: no Lab state is created and failure\n  // must never alter, retry, or delay the upstream request.\n  if (logCtx.activeAttempt && !logCtx.activeAttempt.labRouteSubjectId) {\n    try {\n      const passiveSubject = resolveProductionRouteSubject(\n        config,\n        route.providerName,\n        route.modelId,\n        route.provider,\n        inboundWire,\n      );\n      if (passiveSubject) logCtx.activeAttempt.labRouteSubjectId = passiveSubject.subjectId;\n    } catch {\n      // Omit passive linkage when exact subject construction is unavailable.\n    }\n  }\n'''
          if block not in s:
              count = s.count(seal)
              if count != 1:
                  raise SystemExit(f'expected one initial attempt seal anchor, got {count}')
              s = s.replace(seal, block, 1)
          p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/cl09-core-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/server/responses/core.ts
          git commit -m "feat(lab): link exact production attempts to Lab subjects"
          git push origin HEAD:feat/cl-09-passive-production-evidence
