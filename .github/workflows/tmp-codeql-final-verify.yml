name: Temporary CodeQL final verification

on:
  push:
    branches:
      - agent/codeql-real-findings-20260815

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused Bun suites
        run: >-
          bun test
          tests/codeql-real-findings-regressions.test.ts
          tests/project-config-warnings.test.ts
          tests/codex-inject.test.ts
          tests/codex-plugins-doctor.test.ts
          tests/release-notes.test.ts

      - name: Run quality-gate Node suites
        run: node --test .github/scripts/issue-quality.test.cjs .github/scripts/pr-quality.test.cjs

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check branch diff
        run: git diff --check origin/dev...HEAD
