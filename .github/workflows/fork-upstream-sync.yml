name: Fork Upstream Sync

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: fork-upstream-sync-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted fork scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install script dependencies
        run: bun install --frozen-lockfile

      - name: Fetch upstream release refs
        run: |
          set -eu
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/lidge-jun/opencodex.git
          else
            git remote add upstream https://github.com/lidge-jun/opencodex.git
          fi
          git fetch upstream main dev --tags --prune
          bootstrap_refs=()
          if git ls-remote --exit-code origin refs/heads/vendor/main >/dev/null; then
            git fetch origin refs/heads/vendor/main:refs/heads/vendor/main
          else
            git branch vendor/main upstream/main
            bootstrap_refs+=(refs/heads/vendor/main:refs/heads/vendor/main)
          fi
          if git ls-remote --exit-code origin refs/heads/vendor/dev >/dev/null; then
            git fetch origin refs/heads/vendor/dev:refs/heads/vendor/dev
          else
            git branch vendor/dev upstream/dev
            bootstrap_refs+=(refs/heads/vendor/dev:refs/heads/vendor/dev)
          fi
          if [ "${#bootstrap_refs[@]}" -gt 0 ]; then
            git push origin "${bootstrap_refs[@]}"
          fi

      - name: Create dev integration worktree
        env:
          FORK_SYNC_WORKTREE: ${{ runner.temp }}/fork-sync-dev
        run: |
          set -eu
          git fetch origin dev:refs/remotes/origin/dev
          git worktree add --detach "$FORK_SYNC_WORKTREE" refs/remotes/origin/dev

      - name: Detect and pin vendor refs
        id: pin
        env:
          FORK_SYNC_UPSTREAM_REPO: https://github.com/lidge-jun/opencodex.git
          FORK_SYNC_WORKTREE: ${{ runner.temp }}/fork-sync-dev
        run: |
          set -eu
          cd "$FORK_SYNC_WORKTREE"
          event_file="$RUNNER_TEMP/fork-sync-event.json"
          bun "$GITHUB_WORKSPACE/scripts/fork/sync/cli.ts" pin > "$event_file"
          kind="$(jq -r '.kind' "$event_file")"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Fork sync lane: $kind" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$event_file" > "$RUNNER_TEMP/fork-sync-event-path"

      - name: Push updated vendor refs
        if: steps.pin.outputs.kind == 'pin-updated' || steps.pin.outputs.kind == 'history-diverged'
        run: |
          set -eu
          git push origin refs/heads/vendor/main:refs/heads/vendor/main refs/heads/vendor/dev:refs/heads/vendor/dev

      - name: Assert pin preserved default branch HEAD
        run: |
          set -eu
          current_branch="$(git rev-parse --abbrev-ref HEAD)"
          default_branch="${{ github.event.repository.default_branch }}"
          if [ "$current_branch" != "$default_branch" ]; then
            echo "Pinning moved HEAD from $default_branch to $current_branch"
            exit 1
          fi

      - name: Prepare daily merge
        id: prepare
        if: steps.pin.outputs.kind == 'pin-updated' || steps.pin.outputs.kind == 'main-behind'
        env:
          FORK_SYNC_WORKTREE: ${{ runner.temp }}/fork-sync-dev
        run: |
          set -eu
          cd "$FORK_SYNC_WORKTREE"
          event_file="$(cat "$RUNNER_TEMP/fork-sync-event-path")"
          result_file="$RUNNER_TEMP/fork-sync-prepare.json"
          bun "$GITHUB_WORKSPACE/scripts/fork/sync/cli.ts" prepare < "$event_file" > "$result_file"
          status="$(jq -r '.status' "$result_file")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "merged" ]; then
            branch="$(jq -r '.branch' "$result_file")"
            git push origin "refs/heads/$branch:refs/heads/$branch"
            jq -n \
              --slurpfile event "$event_file" \
              --slurpfile result "$result_file" \
              '{event: $event[0], result: $result[0]}' \
              > "$RUNNER_TEMP/fork-sync-draft-pr.json"
          fi

      - name: Create or update draft sync PR
        if: steps.prepare.outputs.status == 'merged'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          bun "$GITHUB_WORKSPACE/scripts/fork/sync/cli.ts" draft-pr < "$RUNNER_TEMP/fork-sync-draft-pr.json"

      # Issue tracking is always enabled for non-noop events.
      - name: Notify GitHub issue
        if: steps.pin.outputs.kind != 'already-current'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORK_SYNC_UPSTREAM_REPO: https://github.com/lidge-jun/opencodex.git
          FORK_SYNC_NOTIFIERS: github-issue
          FORK_SYNC_COORDINATORS: ""
        run: |
          set -eu
          event_file="$(cat "$RUNNER_TEMP/fork-sync-event-path")"
          handoff_status="$(jq -r '.status // empty' "$RUNNER_TEMP/fork-sync-prepare.json" 2>/dev/null || true)"
          if [ -z "$handoff_status" ]; then
            handoff_status="$(jq -r '.kind' "$event_file")"
          fi
          handoff_file="$RUNNER_TEMP/fork-sync-handoff.json"
          jq --arg prepareStatus "$handoff_status" \
            '. + {prepareStatus: $prepareStatus}' \
            "$event_file" > "$handoff_file"
          bun "$GITHUB_WORKSPACE/scripts/fork/sync/cli.ts" emit < "$handoff_file"

      # Cursor handles only conflicts the Action could not resolve or
      # disconnected histories; ordinary daily merges stop at a draft PR.
      - name: Notify Cursor handoff
        if: steps.prepare.outputs.status == 'hotspot-handoff' || steps.pin.outputs.kind == 'history-diverged'
        env:
          FORK_SYNC_UPSTREAM_REPO: https://github.com/lidge-jun/opencodex.git
          FORK_SYNC_NOTIFIERS: ""
          FORK_SYNC_COORDINATORS: cursor-webhook
          FORK_SYNC_CURSOR_WEBHOOK_URL: ${{ secrets.FORK_SYNC_CURSOR_WEBHOOK_URL }}
          FORK_SYNC_CURSOR_WEBHOOK_SECRET: ${{ secrets.FORK_SYNC_CURSOR_WEBHOOK_SECRET }}
        run: |
          set -eu
          event_file="$(cat "$RUNNER_TEMP/fork-sync-event-path")"
          bun "$GITHUB_WORKSPACE/scripts/fork/sync/cli.ts" emit < "$event_file"
