name: Temporary relocate CodeQL regressions v2

on:
  push:
    branches:
      - agent/codeql-real-findings-20260815

permissions:
  contents: write

jobs:
  relocate-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[test-relocation-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Relocate regression coverage
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              ".github/scripts/pr-quality.test.cjs",
              '''    assert.equal(
                assessPrDescription("<!-- release notes by coderabbit.ai -->\\n\\n<!-- end -->").reason,
                "empty",
              );''',
              '''    assert.equal(
                assessPrDescription("<!-- release notes by coderabbit.ai -->\\n\\n<!-- end -->").reason,
                "empty",
              );
              assert.equal(
                assessPrDescription("<!--\\n![proof](https://example.invalid/screenshot.png)").reason,
                "empty",
              );''',
          )

          replace_once(
              ".github/scripts/pr-quality.test.cjs",
              '''    assert.equal(
                hasScreenshotEvidence('<!-- <img src="https://example.com/ui.png"> -->'),
                false,
              );''',
              '''    assert.equal(
                hasScreenshotEvidence('<!-- <img src="https://example.com/ui.png"> -->'),
                false,
              );
              assert.equal(
                hasScreenshotEvidence("<!--\\n![after](https://example.com/after.png)"),
                false,
              );''',
          )

          replace_once(
              ".github/scripts/issue-quality.test.cjs",
              '    assert.equal(clean("Hello <!-- hidden --> world"), "Hello  world");',
              '''    assert.equal(clean("Hello <!-- hidden --> world"), "Hello  world");
              assert.equal(clean("<!--\\nhidden issue text"), "");
              assert.equal(clean("<!-- hidden -->\\nVisible text"), "Visible text");''',
          )

          replace_once(
              "tests/release-notes.test.ts",
              '''    expect(hasMeaningfulCarriedNotes(stripped)).toBe(false);
              });
            });

            describe("joinCarriedPreviewNotes",''',
              '''    expect(hasMeaningfulCarriedNotes(stripped)).toBe(false);
              });

              test("HTML comments do not become meaningful carried notes", () => {
                expect(hasMeaningfulCarriedNotes("<!-- generated\\nmetadata -->")).toBe(false);
                expect(hasMeaningfulCarriedNotes("<!-- generated\\nmetadata")).toBe(false);
                expect(hasMeaningfulCarriedNotes("<!-- hidden -->\\n## What's Changed\\n* visible fix")).toBe(true);
              });
            });

            describe("joinCarriedPreviewNotes",''',
          )

          replace_once(
              "tests/project-config-warnings.test.ts",
              '''  invalidateProjectConfigDiagnosticsCache,
              parseTrustedProjectPathsFromCodexConfig,''',
              '''  invalidateProjectConfigDiagnosticsCache,
              parseTomlDocument,
              parseTrustedProjectPathsFromCodexConfig,''',
          )

          replace_once(
              "tests/project-config-warnings.test.ts",
              '''describe("parseTrustedProjectPathsFromCodexConfig", () => {''',
              '''describe("parseTomlDocument", () => {
              test("malformed basic strings cannot wedge parsing and escaped strings still parse", () => {
                const malformed = parseTomlDocument('model_provider = "' + "\\\\".repeat(64));
                expect(typeof malformed.root.model_provider).toBe("string");

                const valid = parseTomlDocument('model_provider = "provider\\\\\\\\name"');
                expect(valid.root.model_provider).toBe("provider\\\\name");
              }, 2_000);
            });

            describe("parseTrustedProjectPathsFromCodexConfig", () => {''',
          )

          replace_once(
              "tests/codex-inject.test.ts",
              '''  test("preserves non-opencodex routed model names during fallback restore", () => {''',
              '''  test("malformed quoted root values cannot wedge restore transforms", () => {
              const slashRun = "\\\\".repeat(64);
              const stripped = stripOpencodexConfig([
                'model_provider = "opencodex"',
                `model = "${slashRun}`,
                `model_catalog_json = "${slashRun}`,
                "",
              ].join("\\n"));

              expect(stripped).toContain(`model = "${slashRun}`);
              expect(stripped).toContain(`model_catalog_json = "${slashRun}`);
            }, 2_000);

            test("preserves non-opencodex routed model names during fallback restore", () => {''',
          )

          replace_once(
              "tests/codex-plugins-doctor.test.ts",
              '''  test("parses a table header with a trailing inline comment", () => {''',
              '''  test("malformed quoted marketplace values cannot wedge diagnosis", () => {
              const { dir, configPath } = makeConfig(
                `[marketplaces.openai-bundled]\\nsource_type = "local"\\nsource = "${"\\\\".repeat(64)}\\n`,
              );
              try {
                const result = diagnoseCodexBundledPlugins({ platform: "win32", configPath });
                expect(result.applicable).toBe(true);
              } finally {
                rmSync(dir, { recursive: true, force: true });
              }
            }, 2_000);

            test("parses a table header with a trailing inline comment", () => {''',
          )

          catch_all = Path("tests/codeql-real-findings-regressions.test.ts")
          if not catch_all.exists():
              raise SystemExit("expected catch-all regression file to exist")
          catch_all.unlink()

          doctor = Path("src/codex/plugins-doctor.ts")
          doctor_text = doctor.read_text(encoding="utf-8")
          doctor.write_text(doctor_text.rstrip("\n") + "\n", encoding="utf-8")

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run affected Bun suites
        run: >-
          bun test
          tests/project-config-warnings.test.ts
          tests/codex-inject.test.ts
          tests/codex-plugins-doctor.test.ts
          tests/release-notes.test.ts

      - name: Run quality-gate Node suites
        run: node --test .github/scripts/issue-quality.test.cjs .github/scripts/pr-quality.test.cjs

      - name: Typecheck
        run: bun run typecheck

      - name: Check diff
        run: git diff --check

      - name: Commit relocated tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/pr-quality.test.cjs .github/scripts/issue-quality.test.cjs tests/release-notes.test.ts tests/project-config-warnings.test.ts tests/codex-inject.test.ts tests/codex-plugins-doctor.test.ts tests/codeql-real-findings-regressions.test.ts src/codex/plugins-doctor.ts
          git diff --cached --quiet && exit 0
          git commit -m "test: colocate CodeQL regressions with owner suites [test-relocation-applied]"
          git push origin HEAD:agent/codeql-real-findings-20260815
